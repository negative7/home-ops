[env]
JUST_UNSTABLE = "1"
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = '{{config_root}}/kubeconfig'
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = '{{config_root}}/talosconfig'

[settings]
pipx.uvx = true

[tools]
"aqua:astral-sh/uv" = "0.13.5"
"aqua:google/yamlfmt" = "0.21.0"
"npm:markdownlint-cli2" = "0.24.0"
"pipx:ansible" = "14.5.0"
"pipx:ansible-core" = "2.21.5"
"pipx:b2" = "5.0.2"
"pipx:yamllint" = "1.38.0"


actionlint = "1.7.12"
"aqua:siderolabs/talos" = "1.14.4"
kubectl = "1.37.1"
"aqua:helm/helm" = "4.3.1"
"aqua:fluxcd/flux2" = "2.10.0"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:casey/just" = "1.59.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:aquasecurity/trivy" = "0.76.1"
lefthook = "2.2.2"
"aqua:mikefarah/yq" = "4.54.1"
"github:home-operations/flate" = "0.6.5"
"aqua:helmfile/helmfile" = "1.8.2"
"github:mitsuhiko/minijinja" = "3.0.3"
"1password-cli" = "2.41.1"
"aqua:charmbracelet/gum" = "2.0.2"
node = "26.12.1"
oxfmt = "0.74.0"
shellcheck = "0.11.0"
go = "1.27.3"
"go:code.gitea.io/tea" = "1.3.3"

[hooks]
postinstall = "ansible-galaxy install -r {{config_root}}/ansible/requirements.yaml && lefthook install"
