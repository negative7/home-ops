---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter
  interval: 30m
  values:
    fullnameOverride: blackbox-exporter
    image:
      registry: quay.io
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        # Fails (probe_failed_due_to_regex=1) while UniFi OS reports a pending OS/app update
        unifi_update:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: ip4
            fail_if_body_matches_regexp:
              - '"deviceState":"updateAvailable"'
            tls_config:
              insecure_skip_verify: true # UniFi OS serves a self-signed CN=unifi.local cert
    prometheusRule:
      enabled: true
      rules:
        - alert: BlackboxProbeFailed
          # a body-regex failure is a finding (e.g. UniFiUpdateAvailable), not an unreachable host
          # last_over_time bridges the 5m lookback for slow probes (unifi-update runs every 15m)
          expr: last_over_time(probe_success[20m]) == 0 unless on (instance, job) last_over_time(probe_failed_due_to_regex[20m]) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The host {{ $labels.target }} is currently unreachable
        - alert: UniFiUpdateAvailable
          expr: last_over_time(probe_failed_due_to_regex{job="unifi-update"}[20m]) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: |-
              UniFi OS on {{ $labels.instance }} reports an available update (OS or app)
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - NET_RAW
    serviceMonitor:
      enabled: true
      defaults:
        interval: 1m
        scrapeTimeout: 10s
