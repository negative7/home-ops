---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zfs-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: zfs.rules
      rules:
        - alert: ZfsUnexpectedPoolState
          annotations:
            summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
          expr: |
            node_zfs_zpool_state{state!="online"} > 0
          for: 15m
          labels:
            severity: critical
        # zfs_* metrics come from lviv's zfs-metrics timer (ansible/lviv, node-exporter textfile)
        - alert: ZfsPoolCapacityHigh
          annotations:
            summary: ZFS pool {{$labels.pool}} on {{$labels.instance}} is {{ $value | humanizePercentage }} full
          expr: |
            zfs_pool_allocated_bytes / zfs_pool_size_bytes > 0.85
          for: 1h
          labels:
            severity: warning
        - alert: ZfsPoolCapacityCritical
          annotations:
            summary: ZFS pool {{$labels.pool}} on {{$labels.instance}} is {{ $value | humanizePercentage }} full; free space with `zfs set refreservation=none tank/reserved`
          expr: |
            zfs_pool_allocated_bytes / zfs_pool_size_bytes > 0.90
          for: 15m
          labels:
            severity: critical
        # Daily is the slowest schedule any dataset uses, so >25h means sanoid stopped snapshotting it
        - alert: ZfsSnapshotStale
          annotations:
            summary: Newest sanoid snapshot of {{$labels.dataset}} on {{$labels.instance}} is {{ $value | humanizeDuration }} old
          expr: |
            time() - zfs_dataset_newest_snapshot_timestamp_seconds > 25 * 3600
          for: 1h
          labels:
            severity: warning
        - alert: ZfsMetricsStale
          annotations:
            summary: ZFS pool and snapshot metrics from lviv are missing or stale; check zfs-metrics.timer
          expr: |
            time() - zfs_metrics_timestamp_seconds > 1800 or absent(zfs_metrics_timestamp_seconds)
          for: 30m
          labels:
            severity: warning
