---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  # Callers taken from kguardian (2026-10-28 to 2026-11-11) and checked against the repo. Ingress only.
  ingress:
    - # Query clients in the namespace
      fromEndpoints:
        - matchLabels:
            app: grafana
        - matchLabels:
            app.kubernetes.io/name: kromgo
        - matchLabels:
            app.kubernetes.io/name: prometheus-adapter
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - # envoy-internal serves the Prometheus UI
      fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - # Probes go through the blackbox-exporter Service VIP; Cilium drops same-node replies without this
      fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus-blackbox-exporter
