---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-vector
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs-vector
  values:
    controllers:
      victoria-logs-vector:
        type: daemonset

        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

        containers:
          app:
            image:
              repository: mirror.gcr.io/timberio/vector
              tag: 0.58.0-distroless-libc@sha256:d3c25aaf3d095d8eae2b08f1d196a25fb9b72bc9800a948cc2391a8c8837f132
            args:
              - --config
              - /etc/vector/vector.yaml
            env:
              TZ: America/New_York
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      config:
        type: configMap
        name: victoria-logs-vector
        globalMounts:
          - path: /etc/vector/vector.yaml
            subPath: vector.yaml
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /var/lib/vector
