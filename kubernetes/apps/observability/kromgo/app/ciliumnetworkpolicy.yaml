---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kromgo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo
  egress:
    - # Prometheus (egress label block-all denies everything else)
      toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - protocol: TCP
              port: "9090"
