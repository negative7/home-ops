---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 30m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    autoDiskfulAfter: 10m
    # Anything above 1 enables leader election (warm standby, ~15s failover)
    # instead of a single controller pod being a SPOF for provision/snapshot/resize.
    replicaCount: 2
    global:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: miroir
                  app.kubernetes.io/instance: miroir
                  app.kubernetes.io/component: controller
              topologyKey: kubernetes.io/hostname
    drbd:
      # Cuts write amplification under the scattered random writes of the
      # DB/media workloads on miroir-replicated; must be a prime below 65534.
      alExtents: 6007
    monitoring:
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
