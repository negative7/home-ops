---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spoolman
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: spoolman
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: miroir
      namespace: miroir-system
    - name: kopiur
      namespace: system
  interval: 1h
  path: "./kubernetes/apps/selfhosted/spoolman/app"
  postBuild:
    substitute:
      APP: spoolman
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
      KOPIUR_CLAIM: spoolman
      KOPIUR_STORAGECLASS: miroir-replicated
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
