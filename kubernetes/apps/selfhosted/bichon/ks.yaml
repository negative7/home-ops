---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bichon
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: miroir
      namespace: miroir-system
    - name: kopiur
      namespace: system
  interval: 1h
  path: "./kubernetes/apps/selfhosted/bichon/app"
  postBuild:
    substitute:
      APP: bichon
      KOPIUR_MOVER_UID: "2000"
      KOPIUR_MOVER_GID: "2000"
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_STORAGECLASS: miroir-replicated
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
