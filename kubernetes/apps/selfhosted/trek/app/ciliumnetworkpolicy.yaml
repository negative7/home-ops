---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trek
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trek
  egress:
    - # Kanidm OIDC: idm.negative7.com hairpins to the envoy-external pods
      # (egress label internet denies the rest of the cluster)
      toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-external
      toPorts:
        - ports:
            - protocol: TCP
              port: "10443"
