---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
spec:
  chartRef:
    kind: OCIRepository
    name: trek
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      trek:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=mauriceboe/trek
              repository: mauriceboe/trek
              tag: 4.2.1@sha256:777f4d647e973fe7d87fecd957e854b86d57e8d977fd041763e0ca19b3c2e2c0
            env:
              ALLOWED_ORIGINS: https://travel.negative7.com
              APP_URL: https://travel.negative7.com
              FORCE_HTTPS: "true"
              NODE_ENV: production
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-trek-oidc
                    key: client-id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-trek-oidc
                    key: client-secret
              OIDC_DISCOVERY_URL: https://idm.negative7.com/oauth2/openid/trek/.well-known/openid-configuration
              OIDC_DISPLAY_NAME: Kanidm
              OIDC_ISSUER: https://idm.negative7.com/oauth2/openid/trek
              OIDC_ONLY: "true"
              OIDC_SCOPE: openid email profile groups
              PORT: "3000"
              TRUST_PROXY: "1"
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: trek-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: miroir-replicated
        globalMounts:
          - path: /app/data
      uploads:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: miroir-replicated
        globalMounts:
          - path: /app/uploads
    service:
      app:
        controller: trek
        ports:
          http:
            port: 3000
