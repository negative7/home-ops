---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
spec:
  components:
    - ../../../../components/kanidm-oidc
    - ../../../../components/postgres/cert
  dependsOn:
    - name: cnpg-operator
      namespace: database
    - name: barman-cloud-plugin
      namespace: database
    - name: kanidm
      namespace: security
  interval: 1h
  path: "./kubernetes/apps/selfhosted/miniflux/app"
  postBuild:
    substitute:
      APP: miniflux
      OIDC_CALLBACK: /oauth2/oidc/callback
      OIDC_CLIENT_ID_KEY: OAUTH2_CLIENT_ID
      OIDC_CLIENT_SECRET_KEY: OAUTH2_CLIENT_SECRET
      OIDC_DISPLAY_NAME: Miniflux
      OIDC_SCOPES: "[\"openid\", \"profile\", \"email\"]"
      OIDC_SHORT_USERNAME: "true"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
