---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homepage-secret
    creationPolicy: Owner
    template:
      data:
        HOMEPAGE_VAR_SONARR_KEY: "{{ .sonarr_api_key }}"
        HOMEPAGE_VAR_RADARR_KEY: "{{ .radarr_api_key }}"
        HOMEPAGE_VAR_PROWLARR_KEY: "{{ .prowlarr_api_key }}"
        HOMEPAGE_VAR_PLEX_TOKEN: "{{ .plex_token }}"
        HOMEPAGE_VAR_JELLYFIN_KEY: "{{ .hp_jellyfin_key }}"
        HOMEPAGE_VAR_SEERR_KEY: "{{ .seerr_api_key }}"
        HOMEPAGE_VAR_TAUTULLI_KEY: "{{ .tautulli_TAUTULLI_API_KEY }}"
        HOMEPAGE_VAR_PAPERLESS_KEY: "{{ .paperless_api_token }}"
        HOMEPAGE_VAR_HASS_KEY: "{{ .hp_hass_key }}"
        HOMEPAGE_VAR_BAZARR_KEY: "{{ .hp_bazarr_key }}"
        HOMEPAGE_VAR_SABNZBD_KEY: "{{ .hp_sabnzbd_key }}"
        HOMEPAGE_VAR_QBIT_KEY: "{{ .hp_qbit_key }}"
        HOMEPAGE_VAR_AUTOBRR_KEY: "{{ .hp_autobrr_key }}"
        HOMEPAGE_VAR_ADGUARD_USER: "{{ .hp_adguard_user }}"
        HOMEPAGE_VAR_ADGUARD_PASSWORD: "{{ .hp_adguard_password }}"
        HOMEPAGE_VAR_PROXMOX_TOKEN: "{{ .hp_proxmox_token }}"
        HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET: "{{ .hp_proxmox_token_secret }}"
        HOMEPAGE_VAR_PBS_TOKEN: "{{ .pbs_homepage_token_id }}"
        HOMEPAGE_VAR_PBS_TOKEN_SECRET: "{{ .pbs_homepage_token_secret }}"
  data:
    # Only the widget token (the pbs item also holds the admin and kyiv passwords);
    # the lviv playbook writes both fields when it creates the token
    - secretKey: pbs_homepage_token_id
      remoteRef:
        key: pbs
        property: homepage_token_id
    - secretKey: pbs_homepage_token_secret
      remoteRef:
        key: pbs
        property: homepage_token_secret
    # Single field: the 1Password item also carries API Credential defaults like "valid from"
    - secretKey: tautulli_TAUTULLI_API_KEY
      remoteRef:
        key: tautulli
        property: TAUTULLI_API_KEY
    - secretKey: paperless_api_token
      remoteRef:
        key: paperless
        property: api_token
    - secretKey: seerr_api_key
      remoteRef:
        key: seerr
        property: api_key
  dataFrom:
    - extract:
        key: sonarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "sonarr_$1"
    - extract:
        key: radarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "radarr_$1"
    - extract:
        key: prowlarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "prowlarr_$1"
    - extract:
        key: plex
      rewrite:
        - regexp:
            source: "(.*)"
            target: "plex_$1"
    - extract:
        key: homepage-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "hp_$1"
