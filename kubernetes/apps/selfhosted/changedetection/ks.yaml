---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: changedetection
spec:
  components:
    - ../../../../components/kanidm-oidc/envoy
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: miroir
      namespace: miroir-system
    - name: kopiur
      namespace: system
    - name: kanidm
      namespace: security
  interval: 1h
  path: "./kubernetes/apps/selfhosted/changedetection/app"
  postBuild:
    substitute:
      APP: changedetection
      KOPIUR_CLAIM: changedetection
      KOPIUR_STORAGECLASS: miroir-replicated
      OIDC_DISPLAY_NAME: changedetection.io
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
