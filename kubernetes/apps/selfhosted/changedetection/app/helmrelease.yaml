---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  chartRef:
    kind: OCIRepository
    name: changedetection
  interval: 30m
  dependsOn:
    - name: miroir
      namespace: miroir-system
  values:
    controllers:
      changedetection:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            # Scrapes arbitrary URLs: world only, no in-cluster targets
            egress.policy.home.arpa/internet: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        containers:
          app:
            image:
              # Upstream + CloakBrowser plugin, built from containers/changedetection
              repository: git.negative7.com/negative7/changedetection
              tag: 0.70.4@sha256:d04da0fb20cf5662730ad1fcedf15586818a1bee2fde0252d68b4d41da4b80a1
            env:
              TZ: America/New_York
              PORT: &port 5000
              BASE_URL: https://changedetection.negative7.com
              FETCH_WORKERS: 4
              HIDE_REFERER: true
              PLAYWRIGHT_DRIVER_URL: ws://localhost:3000
              # CloakBrowser runs Chromium in this container: UID 2000 needs a writable HOME,
              # and the ~200 MB binary is re-downloaded into scratch space on each restart
              HOME: /home/app
              CLOAKBROWSER_CACHE_DIR: /cache/cloakbrowser
            envFrom:
              - secretRef:
                  name: changedetection-secret
                  # The pod starts before the CloakBrowser key exists in 1Password
                  optional: true
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 20m
              limits:
                memory: 2Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

          browser:
            image:
              repository: docker.io/dgtlmoon/sockpuppetbrowser
              tag: 0.0.5@sha256:71fed9b1de8de865a8f30c61e6d8d129de183bf34f8cc545dc7ae499198ec935
            env:
              # UID 2000 has no passwd entry, so HOME would be the read-only /
              HOME: /home/chrome
              LOG_LEVEL: INFO
              MAX_CONCURRENT_CHROME_PROCESSES: 4
              SCREEN_WIDTH: 1920
              SCREEN_HEIGHT: 1024
              SCREEN_DEPTH: 16
            probes:
              liveness: &browserProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *browserProbe
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 2Gi
            securityContext: *securityContext

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: changedetection
        advancedMounts:
          changedetection:
            app:
              - path: /datastore
      tmp:
        type: emptyDir
        advancedMounts:
          changedetection:
            app:
              - path: /tmp
                subPath: app
              - path: /home/app
                subPath: app-home
            browser:
              - path: /tmp
                subPath: browser
              - path: /home/chrome
                subPath: home
      cache:
        type: emptyDir
        sizeLimit: 2Gi
        advancedMounts:
          changedetection:
            app:
              - path: /cache

    route:
      app:
        hostnames:
          - changedetection.negative7.com
        parentRefs:
          - name: envoy-internal
            namespace: network
