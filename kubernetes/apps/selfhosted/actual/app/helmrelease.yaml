---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actual
spec:
  chartRef:
    kind: OCIRepository
    name: actual
  interval: 30m
  dependsOn:
    - name: miroir
      namespace: miroir-system
  values:
    controllers:
      actual-bank-sync:
        type: cronjob
        cronjob:
          schedule: "0 1 * * *"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 3600
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          app:
            image:
              repository: node
              tag: 24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
            command:
              - sh
              - -c
              - |
                set -e
                npm install --prefix /app --no-save --no-audit --no-fund @actual-app/api@26.8.1
                node /scripts/sync.js
            env:
              HOME: /app
              NODE_PATH: /app/node_modules
              ACTUAL_SERVER_URL: http://actual.selfhosted.svc.cluster.local:5006
              ACTUAL_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: actual-secret
                    key: password
              ACTUAL_SYNC_ID:
                valueFrom:
                  secretKeyRef:
                    name: actual-secret
                    key: sync_id
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128M
              limits:
                memory: 512M

      actual:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 2000
            runAsUser: 2000

        containers:
          app:
            image:
              repository: ghcr.io/actualbudget/actual-server
              tag: 26.8.1
            env:
              TZ: America/New_York
              ACTUAL_PORT: &httpPort 5006
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 12m
                memory: 128M
              limits:
                memory: 256M

    persistence:
      data:
        existingClaim: actual-data
        advancedMounts:
          actual:
            app:
              - path: /data

      bank-sync-script:
        type: configMap
        name: actual-bank-sync-script
        advancedMounts:
          actual-bank-sync:
            app:
              - path: /scripts
                readOnly: true

      bank-sync-app:
        type: emptyDir
        advancedMounts:
          actual-bank-sync:
            app:
              - path: /app

      bank-sync-tmp:
        type: emptyDir
        advancedMounts:
          actual-bank-sync:
            app:
              - path: /tmp

    route:
      app:
        hostnames:
          - actual.negative7.com
        parentRefs:
          - name: envoy-internal
            namespace: network

    service:
      app:
        controller: actual
        ports:
          http:
            port: *httpPort
