---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sparkyfitness
spec:
  chartRef:
    kind: OCIRepository
    name: sparkyfitness
  interval: 30m
  dependsOn:
    - name: cnpg-operator
      namespace: database
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/codewithcj/sparkyfitness-server
              repository: ghcr.io/codewithcj/sparkyfitness-server
              tag: v1.6.1@sha256:d37fcac4d0d44c212b9bfacabaf53f502adda7c9a28a2c4941c066df7a0778e7
            env:
              TZ: America/New_York
              NODE_ENV: production
              SPARKY_FITNESS_DISABLE_SIGNUP: "false"
              SPARKY_FITNESS_FRONTEND_URL: https://sparkyfitness.negative7.com
              SPARKY_FITNESS_DB_HOST:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgresql-app
                    key: host
              SPARKY_FITNESS_DB_PORT:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgresql-app
                    key: port
              SPARKY_FITNESS_DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgresql-app
                    key: dbname
              SPARKY_FITNESS_DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgresql-app
                    key: user
              SPARKY_FITNESS_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgresql-app
                    key: password
              SPARKY_FITNESS_APP_DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgresql-app
                    key: user
              SPARKY_FITNESS_APP_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: sparkyfitness-postgresql-app
                    key: password
            envFrom:
              - secretRef:
                  name: sparkyfitness-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &serverPort 3010
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *serverPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 20m
                memory: 384Mi
              limits:
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/codewithcj/sparkyfitness-frontend
              repository: ghcr.io/codewithcj/sparkyfitness-frontend
              tag: v1.6.1@sha256:092090994d27c968d4d5ea7808f8d566aa9c323508b564f0bd4762720b358979
            env:
              SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server.selfhosted.svc.cluster.local
              SPARKY_FITNESS_SERVER_PORT: "3010"
              SPARKY_FITNESS_FRONTEND_URL: https://sparkyfitness.negative7.com
            probes:
              liveness: &feProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &frontendPort 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *feProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *frontendPort
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

    persistence:
      uploads:
        existingClaim: sparkyfitness
        advancedMounts:
          server:
            app:
              - path: /app/SparkyFitnessServer/uploads
      backup:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: /app/SparkyFitnessServer/backup
      tmp:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: /tmp
                subPath: tmp
              - path: /app/SparkyFitnessServer/temp_uploads
                subPath: temp_uploads
      nginx-run:
        type: emptyDir
        advancedMounts:
          frontend:
            app:
              - path: /run
      nginx-cache:
        type: emptyDir
        advancedMounts:
          frontend:
            app:
              - path: /var/cache/nginx
      nginx-conf:
        type: emptyDir
        advancedMounts:
          frontend:
            app:
              - path: /etc/nginx/conf.d

    route:
      app:
        hostnames:
          - sparkyfitness.negative7.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http

    service:
      app:
        controller: frontend
        ports:
          http:
            port: *frontendPort
        primary: true
      server:
        controller: server
        ports:
          http:
            port: *serverPort
