---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            env:
              TZ: America/New_York
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres"
                    key: url
              REDIS_HOSTNAME: immich-dragonfly.selfhosted.svc.cluster.local

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    server:
      controllers:
        main:
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch

          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.4.0@sha256:7b7b575029168bfb9eb901d868ce7dbfda0d7818e78aaace29b7b8a08cd4e7d5
              resources:
                requests:
                  cpu: 11m
                  memory: 1Gi
                limits:
                  memory: 2560Mi

    machine-learning:
      controllers:
        main:
          strategy: Recreate

          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.3.6@sha256:14367bfb374b8576ddf49abd67c5ca0190a4c7fcf6303cdad65d7f7bf1a50bc2
              resources:
                requests:
                  cpu: 10m
                  memory: 1Gi
                limits:
                  memory: 4Gi
      persistence:
        cache:
          type: persistentVolumeClaim
          size: 10Gi
          accessMode: ReadWriteOnce
