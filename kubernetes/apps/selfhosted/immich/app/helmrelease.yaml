---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            env:
              TZ: America/New_York
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres"
                    key: url
              REDIS_HOSTNAME: immich-valkey.selfhosted.svc.cluster.local
              # v3.4.2 metrics exporter 400s on the default '::' host; drop once
              # immich-app/immich#33466's fix ships
              IMMICH_HOST: 0.0.0.0

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library

    server:
      controllers:
        main:
          pod:
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch

          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
              resources:
                requests:
                  cpu: 11m
                  memory: 1Gi
                limits:
                  memory: 2560Mi

    machine-learning:
      controllers:
        main:
          strategy: Recreate

          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
              resources:
                requests:
                  cpu: 10m
                  memory: 1Gi
                limits:
                  memory: 4Gi
      persistence:
        cache:
          type: persistentVolumeClaim
          size: 10Gi
          accessMode: ReadWriteOnce
