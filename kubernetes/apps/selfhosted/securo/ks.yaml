---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: securo
spec:
  components:
    - ../../../../components/kanidm-oidc
    - ../../../../components/kopiur/backup
    - ../../../../components/postgres/cert
    - ../../../../components/valkey
  dependsOn:
    - name: kopiur
      namespace: system
    - name: cnpg-operator
      namespace: database
    - name: barman-cloud-plugin
      namespace: database
    - name: kanidm
      namespace: security
  interval: 1h
  path: "./kubernetes/apps/selfhosted/securo/app"
  postBuild:
    substitute:
      APP: securo
      # Created by its migrations; the app role can't create extensions itself
      DATABASE_EXTENSIONS: |
        [
          { name: pgcrypto },
          { name: vector }
        ]
      KOPIUR_CAPACITY: 5Gi
      OIDC_CALLBACK: /api/auth/oidc/callback
      OIDC_DISPLAY_NAME: Securo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
