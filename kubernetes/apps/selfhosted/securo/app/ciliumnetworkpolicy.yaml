---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Backend (API + Celery): egress label `internet` limits bank sync (SimpleFIN) to the world;
# this adds the in-cluster allows: Postgres pooler, Valkey and envoy-external (idm.negative7.com for SSO).
# Ingress: only the frontend nginx reaches the API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: securo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: securo
      app.kubernetes.io/controller: securo
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: securo
            app.kubernetes.io/controller: frontend
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Same-node Service VIP replies count as new ingress on Cilium 1.20
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres
            cnpg.io/podRole: pooler
        - matchLabels:
            app.kubernetes.io/name: securo-valkey
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-external
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres
            cnpg.io/podRole: pooler
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: securo-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - # idm.negative7.com is routed through envoy-external (hairpinned in-cluster)
      toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-external
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Frontend nginx: UI from envoy-internal; egress stays on the cluster default
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: securo-frontend
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: securo
      app.kubernetes.io/controller: frontend
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Same-node Service VIP replies count as new ingress on Cilium 1.20
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: securo
            app.kubernetes.io/controller: securo
