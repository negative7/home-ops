---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: protonmail-bridge
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: protonmail-bridge-secret
    creationPolicy: Owner
    template:
      data:
        # Encrypts the GPG key guarding the Bridge vault on the PVC; changing it needs a re-init
        KEYRING_PASSPHRASE: "{{ .protonmail_bridge_keyring_passphrase }}"
  dataFrom:
    - extract:
        key: protonmail-bridge
      rewrite:
        - regexp:
            source: "(.*)"
            target: "protonmail_bridge_$1"
