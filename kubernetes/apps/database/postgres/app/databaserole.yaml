---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: postgres-pooler-rw
spec:
  cluster:
    name: postgres
  databaseRoleReclaimPolicy: retain
  disablePassword: true
  ensure: present
  login: true
  name: pooler-rw
  superuser: false
---
# Kritika's application and runner roles; the owner role comes from the postgres/base component.
# Passwords live in secrets generated by the kritika app in `dev` and reflected into this namespace.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: postgres-kritika-app
spec:
  cluster:
    name: postgres
  databaseRoleReclaimPolicy: retain
  ensure: present
  login: true
  name: kritika_app
  passwordSecret:
    name: kritika-postgres-app
  superuser: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: postgres-kritika-runner
spec:
  cluster:
    name: postgres
  databaseRoleReclaimPolicy: retain
  ensure: present
  login: true
  name: kritika_runner
  passwordSecret:
    name: kritika-postgres-runner
  superuser: false
