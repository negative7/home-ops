---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kguardian
spec:
  components:
    - ../../../../components/kanidm-oidc/envoy
  dependsOn:
    - name: miroir
      namespace: miroir-system
    - name: kanidm
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/kguardian/kguardian/app
  postBuild:
    substitute:
      APP: kguardian
      OIDC_DISPLAY_NAME: kguardian
      OIDC_GROUP: admins
      OIDC_IMAGE_URL: https://cdn.jsdelivr.net/gh/kguardian-dev/kguardian@frontend/v1.21.1/frontend/public/favicon.svg
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kguardian
