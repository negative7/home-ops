---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Scoped broker tokens (read: frontend/CLI, ingest: controller), generated once in-cluster
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kguardian-broker-auth
spec:
  refreshInterval: "0"
  target:
    name: kguardian-broker-auth
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw
      rewrite:
        - regexp:
            source: "^password$"
            target: read
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw
      rewrite:
        - regexp:
            source: "^password$"
            target: ingest
