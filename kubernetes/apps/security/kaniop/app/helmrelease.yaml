---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaniop
spec:
  chartRef:
    kind: OCIRepository
    name: kaniop
  interval: 30m
  # The chart has no pod labels value
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kaniop
            patch: |
              - op: add
                path: /spec/template/metadata/labels/egress.policy.home.arpa~1kube-api
                value: "true"
  values:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
