---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kaniop
      namespace: security
    - name: kopiur
      namespace: system
  healthChecks:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      name: kanidm
      namespace: security
  healthCheckExprs:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      failed: status.conditions.exists(c, c.type == 'Available' && c.status == 'False')
      current: status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
  interval: 1h
  # The Available health check fails while Kanidm starts; retry instead of waiting the full interval
  retryInterval: 2m
  path: "./kubernetes/apps/security/kanidm/app"
  postBuild:
    substitute:
      APP: kanidm
      KOPIUR_CLAIM: kanidm-data-kanidm-default-0
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
