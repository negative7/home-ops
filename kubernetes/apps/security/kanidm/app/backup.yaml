---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-backup
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kanidm-backup-secret
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        encryption-key: "{{ .encryption_key }}"
  dataFrom:
    - extract:
        key: kanidm_backup
---
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupRepository
metadata:
  name: nas
spec:
  authentication:
    deleter:
      secretRef:
        name: kanidm-backup-secret
    reader:
      secretRef:
        name: kanidm-backup-secret
    writer:
      secretRef:
        name: kanidm-backup-secret
  # Losing the key makes every backup unrecoverable; it lives in 1Password (kanidm_backup)
  encryption:
    mode: clientSide
    keyRef:
      name: kanidm-backup-secret
  s3:
    bucket: kanidm
    endpoint: http://lviv.homelab.internal:9000
    forcePathStyle: true
    insecure: true
    prefix: kanidm
    region: us-east-1
---
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupSchedule
metadata:
  name: kanidm
spec:
  jitterSeconds: 300
  kanidmRef:
    name: kanidm
  localVersions: 7
  repositoryRef:
    name: nas
  # schedule, repositoryRef, kanidmRef and retention are immutable after creation
  retention:
    keepLast: 8
    daily: 7
    weekly: 4
    monthly: 6
    minAge: 24h
  schedule: 30 2 * * *
  timeZone: America/New_York
