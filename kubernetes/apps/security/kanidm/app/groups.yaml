---
# Adopt existing groups; `members` is omitted so membership stays unmanaged
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: apps
spec:
  kanidmRef:
    name: kanidm
---
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: forgejo-admins
spec:
  kanidmRef:
    name: kanidm
  kanidmName: forgejo_admins
---
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: admins
spec:
  kanidmRef:
    name: kanidm
