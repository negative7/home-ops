---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    deploymentAnnotations:
      secret.reloader.stakater.com/auto: "true"
    podLabels:
      # Passes the litellm ingress policy.
      egress.policy.home.arpa/litellm: "true"
    config:
      webUrl: https://kritika.negative7.com
      auth:
        admin:
          password:
            env: KRITIKA_AUTH_ADMIN_PASSWORD
      forgejo:
        forgejo:
          host: git.negative7.com
          # The accounts this connection serves, not the bot that owns the
          # integration: kritika lists and polls repositories per account.
          accounts:
            - negative7
          audience:
            env: KRITIKA_FORGEJO_AUDIENCE
          privateKey:
            env: KRITIKA_FORGEJO_PRIVATE_KEY
          # A second integration scoped to read:repository alone, so runner
          # pods never hold a writable token.
          runnerAudience:
            env: KRITIKA_FORGEJO_RUNNER_AUDIENCE
          webhookSecret:
            env: KRITIKA_FORGEJO_WEBHOOK_SECRET
      embedding:
        model: litellm/openrouter/voyage-code-4
        dims: 1024
      providers:
        litellm:
          type: openai
          baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
          apiKey:
            env: KRITIKA_LITELLM_API_KEY
          pricing:
            neuralwatt/dsv4.1f:
              input: 0.15
              output: 0.6
            openrouter/dsv4.1f:
              input: 0.14
              output: 0.42
      review:
        model: litellm/neuralwatt/dsv4.1f
        fallback: litellm/openrouter/dsv4.1f
      trigger:
        exclude:
          - name: forks
            expr: pr.fork
      egress:
        allow:
          - "*"
          # git.negative7.com resolves to the internal Envoy address here.
          - 10.2.1.103
        deny:
          - 10.244.0.0/16
    env:
      # Generated into this namespace by the LiteLLMVirtualKey, so spend is
      # attributed per app rather than using the proxy's master key.
      KRITIKA_LITELLM_API_KEY:
        valueFrom:
          secretKeyRef:
            name: kritika-litellm
            key: key
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      # Shared CNPG cluster: the owner secret comes from the postgres/pass
      # component (`url` key), the app and runner roles from ExternalSecrets.
      app:
        existingSecret: kritika-postgres-app
      owner:
        existingSecret: kritika-postgres
        key: url
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      podTemplate:
        metadata:
          labels:
            # Leaves the chart's policy (DNS, Postgres, gateway) as the only
            # egress runner pods get; without it the default policy allows all.
            egress.policy.home.arpa/block-all: "true"
        spec:
          runtimeClassName: gvisor
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /api/v1/meta
      hostnames:
        - kritika.negative7.com
      parentRefs:
        - name: envoy-internal
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
    networkPolicy:
      type: cilium
      postgres:
        namespace: database
        podSelector:
          cnpg.io/cluster: postgres
      extraEgress:
        # A NetworkPolicy matches pods and their own ports, not a Service's.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ai
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
          ports:
            - port: 4000
              protocol: TCP
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
