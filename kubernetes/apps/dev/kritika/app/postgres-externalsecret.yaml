---
# The owner role's secret (kritika-postgres) comes from the postgres/pass component. The application
# and runner roles need passwords of their own; the secrets are reflected into `database`, where
# the DatabaseRoles (apps/database/postgres) read them.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  refreshInterval: "0"
  target:
    name: kritika-postgres-app
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "database"
        labels:
          cnpg.io/reload: "true"
      data:
        username: kritika_app
        password: "{{ .password }}"
        uri: "postgresql://kritika_app:{{ .password }}@postgres-rw.database.svc:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-runner
spec:
  refreshInterval: "0"
  target:
    name: kritika-postgres-runner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "database"
        labels:
          cnpg.io/reload: "true"
      data:
        username: kritika_runner
        password: "{{ .password }}"
        uri: "postgresql://kritika_runner:{{ .password }}@postgres-rw.database.svc:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw
