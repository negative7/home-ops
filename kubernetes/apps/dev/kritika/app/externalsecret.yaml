---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-secret
    creationPolicy: Owner
    template:
      data:
        KRITIKA_AUTH_ADMIN_PASSWORD: "{{ .admin_password }}"
        KRITIKA_FORGEJO_PRIVATE_KEY: "{{ .forgejo_private_key }}"
        KRITIKA_FORGEJO_WEBHOOK_SECRET: "{{ .forgejo_webhook_secret }}"
        # Forgejo creates the audiences after the first deploy (the
        # integrations need kritika's public key), so they stay empty until
        # added in 1Password. An empty audience leaves the connection serving
        # only its key.
        KRITIKA_FORGEJO_AUDIENCE: "{{ .forgejo_audience | default \"\" }}"
        KRITIKA_FORGEJO_RUNNER_AUDIENCE: "{{ .forgejo_runner_audience | default \"\" }}"
  dataFrom:
    - extract:
        key: kritika
