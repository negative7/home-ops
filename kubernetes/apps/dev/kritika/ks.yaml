---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kritika
spec:
  components:
    - ../../../../components/postgres/pass
  dependsOn:
    - name: cnpg-operator
      namespace: database
    - name: barman-cloud-plugin
      namespace: database
    # The virtual key is created through the proxy's admin API, so the proxy
    # must exist first.
    - name: litellm
      namespace: ai
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kritika
      namespace: dev
  interval: 1h
  path: "./kubernetes/apps/dev/kritika/app"
  postBuild:
    substitute:
      APP: kritika
      DATABASE_EXTENSIONS: |
        [
          { name: vector },
          { name: vchord }
        ]
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: dev
