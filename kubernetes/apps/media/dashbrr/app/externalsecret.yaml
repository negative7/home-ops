---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dashbrr-secret
    creationPolicy: Owner
    template:
      data:
        DASHBRR_AUTOBRR_API_KEY: "{{ .hp_autobrr_key }}"
        DASHBRR_BAZARR_API_KEY: "{{ .hp_bazarr_key }}"
        DASHBRR_JELLYFIN_API_KEY: "{{ .hp_jellyfin_key }}"
        DASHBRR_OVERSEERR_API_KEY: "{{ .seerr_api_key }}"
        DASHBRR_PLEX_API_KEY: "{{ .plex_token }}"
        DASHBRR_PROWLARR_API_KEY: "{{ .prowlarr_api_key }}"
        DASHBRR_RADARR_API_KEY: "{{ .radarr_api_key }}"
        DASHBRR_SABNZBD_API_KEY: "{{ .hp_sabnzbd_key }}"
        DASHBRR_SONARR_API_KEY: "{{ .sonarr_api_key }}"
  data:
    - secretKey: plex_token
      remoteRef:
        key: plex
        property: token
    - secretKey: prowlarr_api_key
      remoteRef:
        key: prowlarr
        property: api_key
    - secretKey: radarr_api_key
      remoteRef:
        key: radarr
        property: api_key
    - secretKey: seerr_api_key
      remoteRef:
        key: seerr
        property: api_key
    - secretKey: sonarr_api_key
      remoteRef:
        key: sonarr
        property: api_key
  dataFrom:
    - extract:
        key: homepage-secrets
      rewrite:
        - regexp:
            source: "(.*)"
            target: "hp_$1"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Keys generated for Dashbrr alone (Qui: Settings → API Keys; Maintainerr: Settings → API key).
# Kept apart so a missing field only drops those two cards (envFrom is optional)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr-extra
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dashbrr-extra-secret
    creationPolicy: Owner
    template:
      data:
        DASHBRR_MAINTAINERR_API_KEY: "{{ .maintainerr_api_key }}"
        DASHBRR_QUI_API_KEY: "{{ .qui_api_key }}"
  dataFrom:
    - extract:
        key: dashbrr
