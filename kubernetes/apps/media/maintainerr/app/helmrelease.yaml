---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
spec:
  chartRef:
    kind: OCIRepository
    name: maintainerr
  interval: 30m
  dependsOn:
    - name: miroir
      namespace: miroir-system
    - name: plex
      namespace: media
  values:
    controllers:
      maintainerr:
        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: 3.31.0@sha256:33d86e5f03ed25204788b1e9cd9a2b3f0299cf49fae968220484b57008962399
            env:
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 512Mi

    service:
      app:
        annotations:
          com.dashbrr.service.type: maintainerr
          com.dashbrr.service.name: Maintainerr
          com.dashbrr.service.url: http://maintainerr.media.svc.cluster.local:6246
          com.dashbrr.service.apikey: "$${DASHBRR_MAINTAINERR_API_KEY}"
        controller: maintainerr
        ports:
          http:
            port: &port 6246

    route:
      app:
        hostnames:
          - maintainerr.negative7.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: maintainerr
        globalMounts:
          - path: /opt/data
