---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Session signing key (also the frontend/job-server internal API key), generated once in-cluster
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats
spec:
  refreshInterval: "0"
  target:
    name: streamystats-secret
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw
      rewrite:
        - regexp:
            source: "^password$"
            target: SESSION_SECRET
