---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: streamystats
spec:
  chartRef:
    kind: OCIRepository
    name: streamystats
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      frontend:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/fredrikburmester/streamystats-nextjs
              tag: v2.20.0@sha256:45f93e6233eac3802d056c237293482704ae5dd9502a2566f6df5aa8a4fa214c
            env: &env
              TZ: America/New_York
              NODE_ENV: production
              HOSTNAME: 0.0.0.0
              JOB_SERVER_URL: http://streamystats-job-server.media.svc.cluster.local:3005
              NEXTJS_URL: http://streamystats-frontend.media.svc.cluster.local:3000
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: streamystats-postgres
                    key: url
              SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: streamystats-secret
                    key: SESSION_SECRET
            probes:
              liveness: &frontendProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3000
              readiness: *frontendProbes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 160Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      job-server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/fredrikburmester/streamystats-job-server
              tag: v2.20.0@sha256:b9e6fc640b02ede44f379970cf3f8e81a20bb82bb846e2f738c5db650784137c
            env:
              <<: *env
              HOST: 0.0.0.0
              PORT: "3005"
              # Upstream defaults poll every 5s and sync every minute
              SESSION_POLL_INTERVAL_MS: "30000"
              CRON_ACTIVITY_SYNC: "*/5 * * * *"
              CRON_RECENT_ITEMS_SYNC: "*/5 * * * *"
              CRON_USER_SYNC: "*/5 * * * *"
              CRON_JOB_CLEANUP: "*/5 * * * *"
            probes:
              liveness: &jobProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3005
              readiness: *jobProbes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 320Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - streamystats.negative7.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: frontend
                port: 3000
    service:
      frontend:
        controller: frontend
        ports:
          http:
            port: 3000
      job-server:
        controller: job-server
        ports:
          http:
            port: 3005
