---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyplex-watched
spec:
  chartRef:
    kind: OCIRepository
    name: jellyplex-watched
  interval: 30m
  values:
    controllers:
      jellyplex-watched:
        type: cronjob
        cronjob:
          schedule: "5 * * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 0
          ttlSecondsAfterFinished: 3600
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
        containers:
          app:
            image:
              repository: ghcr.io/luigi311/jellyplex-watched
              tag: 9.0.0@sha256:f7174e8a53fb5782a81e5cddf4ede5406eed7577c171406cab3de73bffb2c6c7
            env:
              TZ: America/New_York
              DRYRUN: false
              DEBUG_LEVEL: "DEBUG"
              PLEX_BASEURL: http://plex.media.svc.cluster.local:32400
              PLEX_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: jellyplex-watched-secret
                    key: plex_token
              JELLYFIN_BASEURL: http://jellyfin.media.svc.cluster.local:8096
              JELLYFIN_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: jellyplex-watched-secret
                    key: jellyfin_api_key
              LOG_FILE: /tmp/jellyplex-watched.log
              MARK_FILE: /tmp/jellyplex-watched.mark.log
              RUN_ONLY_ONCE: true
              LIBRARY_MAPPING: '{ "Shows": "TV Shows" }'
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          jellyplex-watched:
            app:
              - path: /tmp
                subPath: tmp
