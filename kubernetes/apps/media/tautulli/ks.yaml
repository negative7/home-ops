---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tautulli
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  dependsOn:
    - name: miroir
      namespace: miroir-system
    - name: kopiur
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/media/tautulli/app
  postBuild:
    substitute:
      APP: tautulli
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
