---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app externaldns-unifi
spec:
  chartRef:
    kind: OCIRepository
    name: externaldns-unifi
  interval: 30m
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.13@sha256:211a3c951fc94386b14190a99239caa9c8e4b036b35259180979c5df4bd90cdd
        env:
          - name: UNIFI_HOST
            value: https://10.0.1.1
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-unifi-secret
                key: external_dns_api_key
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - crd
      - gateway-httproute
      - service
    # Skip DNSEndpoints meant for Cloudflare; unlabeled routes and services still match
    labelFilter: dns.negative7.com/provider!=cloudflare
    txtOwnerId: main
    txtPrefix: k8s.main.%{record_type}-
    domainFilters:
      - negative7.com
      - homelab.internal
      - home.internal
      - iot.internal
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
