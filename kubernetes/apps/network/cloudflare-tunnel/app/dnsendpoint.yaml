---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: cloudflare-tunnel
spec:
  # Public ingress now enters via odesa (caddy-l4 SNI passthrough over WireGuard to envoy-external).
  # ingress-ext stays a CNAME so the switch is an in-place update rather than a CNAME→A replace;
  # both records live in this one DNSEndpoint so they can never be applied out of order.
  endpoints:
    - dnsName: odesa-edge.negative7.com
      recordType: A
      targets:
        - 135.148.43.50
      providerSpecific:
        - &unproxied
          name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    - dnsName: ingress-ext.negative7.com
      recordType: CNAME
      targets:
        - odesa-edge.negative7.com
      providerSpecific:
        - *unproxied
