---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    external-dns.kubernetes.io/target: &hostname ingress-ext.negative7.com
    gatus.home-operations.com/endpoint: |-
      client:
        dns-resolver: tcp://1.1.1.1:53
      group: external
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: 10.2.1.102
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: negative7-com-tls
    # odesa caddy-l4 only (PROXY v2 required, source pinned by the CiliumNetworkPolicy)
    - name: http-proxy
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-proxy
      protocol: HTTPS
      port: 8443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: negative7-com-tls
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
# Section-level policies replace the shared `envoy` one on the proxy listeners: the real client IP
# comes from the PROXY header, so a client-sent X-Forwarded-For is dropped instead of trusted
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-external-http-proxy
spec:
  headers:
    earlyRequestHeaders:
      remove:
        - x-forwarded-for
  http2:
    onInvalidMessage: TerminateStream
  proxyProtocol:
    optional: false
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      sectionName: http-proxy
  tcpKeepalive: {}
  timeout:
    http:
      idleTimeout: 60s
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-external-https-proxy
spec:
  headers:
    earlyRequestHeaders:
      remove:
        - x-forwarded-for
  http2:
    onInvalidMessage: TerminateStream
  proxyProtocol:
    optional: false
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
      sectionName: https-proxy
  tcpKeepalive: {}
  timeout:
    http:
      idleTimeout: 60s
  tls:
    alpnProtocols:
      - h2
      - http/1.1
    minVersion: "1.2"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-external-ingress
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: envoy-external
  ingress:
    # Direct listeners (LAN/in-cluster hairpin), health checks and metrics stay open
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
            - port: "19001"
              protocol: TCP
            - port: "19002"
              protocol: TCP
            - port: "19003"
              protocol: TCP
    # Unprivileged listener ports stay :8080/:8443 on the pod. Match odesa's real
    # WireGuard source before Envoy reads any PROXY v2 metadata.
    - fromCIDR:
        - 10.99.0.1/32
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: envoy-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  lua:
    - type: ValueRef
      valueRef:
        name: envoy-external-extensions
        kind: ConfigMap
        group: v1
