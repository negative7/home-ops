---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname crowdsec
  namespace: &namespace network
spec:
  targetNamespace: *namespace
  interval: 1h
  path: "./kubernetes/apps/network/crowdsec/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &appname crowdsec-bouncer
  namespace: &namespace network
spec:
  targetNamespace: *namespace
  interval: 1h
  path: "./kubernetes/apps/network/crowdsec/bouncer"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: crowdsec
      namespace: network
    - name: envoy-gateway-config
      namespace: network
