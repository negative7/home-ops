---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  interval: 1h
  install:
    disableSchemaValidation: true # the chart schema rejects the kubernetes acquisition source
  upgrade:
    disableSchemaValidation: true
  values:
    container_runtime: containerd # the default (docker) mounts /var/lib/docker/containers into the agent
    image:
      repository: ghcr.io/crowdsecurity/crowdsec
      tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
      # Used by the CAPI registration hook Job (defaults to an unpinned :latest)
      kubectl:
        repository: mirror.gcr.io/alpine/kubectl
        tag: 1.37.1@sha256:8c72f6f732ce7ef11cdb1bea25faa4f4a521872a12c89e3f40ba9edb52a4d4f2
    config:
      parsers:
        s02-enrich:
          # Same allowlist as odesa: never ban the home ISP (hairpinned LAN traffic arrives from the WAN IP)
          home-allowlist.yaml: |
            name: custom/home-allowlist
            description: "Allow home ISP (AT&T - AS7018)"
            whitelist:
              reason: "home ISP (AT&T)"
              expression:
                - evt.Meta.ASNumber == "7018"
    lapi:
      env:
        - name: USE_WAL
          value: "true"
      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      # Decisions come back from CAPI and the bouncer re-registers from BOUNCER_KEY_envoy, so nothing here needs a PVC
      persistentVolume:
        data:
          enabled: false
        config:
          enabled: false
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
        - name: PARSERS
          value: crowdsecurity/geoip-enrich crowdsecurity/whitelists
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
