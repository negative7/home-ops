---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  # Generated once and never rotated: LAPI registers the bouncer from BOUNCER_KEY_envoy on every start
  refreshInterval: "0"
  target:
    name: crowdsec-secret
    template:
      engineVersion: v2
      data:
        BOUNCER_KEY_envoy: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw
