---
# Carries the Dashbrr discovery annotations for the lviv container (no postBuild here, so no $$ escaping)
apiVersion: v1
kind: Service
metadata:
  name: qui
  annotations:
    com.dashbrr.service.type: qui
    com.dashbrr.service.name: Qui
    com.dashbrr.service.url: http://lviv.homelab.internal:7476
    com.dashbrr.service.apikey: "${DASHBRR_QUI_API_KEY}"
spec:
  type: ExternalName
  externalName: lviv.homelab.internal
  ports:
    - name: http
      port: 7476
