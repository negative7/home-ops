---
# Carries the Dashbrr discovery annotations for the lviv container (no postBuild here, so no $$ escaping)
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  annotations:
    com.dashbrr.service.type: sabnzbd
    com.dashbrr.service.name: SABnzbd
    com.dashbrr.service.url: http://lviv.homelab.internal:6060
    com.dashbrr.service.apikey: "${DASHBRR_SABNZBD_API_KEY}"
spec:
  type: ExternalName
  externalName: lviv.homelab.internal
  ports:
    - name: http
      port: 6060
