---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo-negative7
  namespace: renovate
spec:
  discoveryFilters:
    - negative7/*
  extraEnv:
    - name: RENOVATE_ALLOWED_COMMANDS
      value: |-
        ["pnpm run bundle"]
    - name: RENOVATE_HOST_RULES
      value: |-
        [{"matchHost": "git.negative7.com", "allowInternal": true}]
    - name: RENOVATE_REDIS_URL
      value: redis://renovate-dragonfly.renovate.svc.cluster.local:6379
    - name: RENOVATE_REPOSITORY_CACHE
      value: enabled
    - name: RENOVATE_REPOSITORY_CACHE_TYPE
      value: s3://renovate/negative7/
    - name: RENOVATE_S3_ENDPOINT
      value: http://lviv.homelab.internal:9000
    - name: RENOVATE_S3_PATH_STYLE
      value: "true"
    - name: AWS_REGION
      value: us-east-1
  image: ghcr.io/renovatebot/renovate:44.181.10@sha256:e3a401485f30cab4c7a076f76f27b0231dff2ed01750824fadac928339f6e199
  parallelism: 5
  provider:
    name: forgejo
    endpoint: https://git.negative7.com/api/v1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: 0 * * * *
  secretRef: renovate-secret
  webhook:
    enabled: true
    authentication:
      enabled: false
