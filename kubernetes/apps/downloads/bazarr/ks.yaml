---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr
spec:
  components:
    - ../../../../components/kanidm-oidc/envoy
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  dependsOn:
    - name: miroir
      namespace: miroir-system
    - name: kopiur
      namespace: system
    - name: kanidm
      namespace: security
  interval: 1h
  path: "./kubernetes/apps/downloads/bazarr/app"
  postBuild:
    substitute:
      APP: bazarr
      KOPIUR_CLAIM: bazarr-config
      KOPIUR_STORAGECLASS: miroir-replicated
      OIDC_DISPLAY_NAME: Bazarr
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
