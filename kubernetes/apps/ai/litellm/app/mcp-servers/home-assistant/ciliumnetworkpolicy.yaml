---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
  # Home Assistant host (hass.homelab.internal)
  egress:
    - toCIDR:
        - 10.0.4.12/32
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
