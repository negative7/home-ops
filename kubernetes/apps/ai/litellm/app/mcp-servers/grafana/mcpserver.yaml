---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: grafana-mcp
spec:
  alias: grafana
  proxyRef: litellm
  transport: http
  workload:
    image: docker.io/grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
    # The image entrypoint defaults to SSE, so override it
    command:
      - /app/mcp-grafana
    args:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      - --allowed-hosts=grafana-mcp.ai.svc.cluster.local:8000,grafana-mcp.ai.svc:8000,grafana-mcp:8000
      # Drops write tools and raw-SQL query tools
      - --disable-write
    automountServiceAccountToken: false
    env:
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        valueFrom:
          secretKeyRef:
            name: grafana-mcp
            key: token
      - name: GRAFANA_URL
        value: http://grafana-service.observability.svc.cluster.local:3000
    path: /mcp
    podLabels:
      app.kubernetes.io/name: grafana-mcp
      egress.policy.home.arpa/block-all: "true"
    podSecurityContext:
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    port: 8000
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
