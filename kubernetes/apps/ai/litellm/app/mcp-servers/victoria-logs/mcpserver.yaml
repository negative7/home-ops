---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: victoria-logs-mcp
spec:
  alias: victoria_logs
  proxyRef: litellm
  transport: http
  workload:
    image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0@sha256:753bb4fbe402ca1a782842f44636830f9895736f11d7fe783b924f8a0daf083d
    automountServiceAccountToken: false
    env:
      - name: MCP_LISTEN_ADDR
        value: :8081
      - name: MCP_LOG_FORMAT
        value: json
      - name: MCP_LOG_LEVEL
        value: info
      - name: MCP_SERVER_MODE
        value: http
      - name: VL_INSTANCE_ENTRYPOINT
        value: http://victoria-logs-server.observability.svc.cluster.local:9428
    path: /mcp
    podLabels:
      app.kubernetes.io/name: victoria-logs-mcp
      egress.policy.home.arpa/block-all: "true"
    podSecurityContext:
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    port: 8081
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
