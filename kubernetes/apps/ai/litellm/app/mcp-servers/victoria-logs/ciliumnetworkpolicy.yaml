---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Same-node Service VIP replies count as new ingress on Cilium 1.20
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
            app.kubernetes.io/component: server
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: victoria-logs-single
            app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
