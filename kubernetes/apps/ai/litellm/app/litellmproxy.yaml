---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
  replicas: 1
  # Startup (imports + Prisma toolchain) is single-threaded and takes over a
  # minute here; the default liveness probe kills it first. No startupProbe in
  # the CRD, so delay liveness up to the Prisma toolchain timeout (600s).
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 600
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # Admin API access for DB-backed resources (LiteLLMVirtualKey). Models stay
  # file-backed because applyMode is left at its default.
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
  env:
    - name: CHATGPT_TOKEN_DIR
      value: /app/chatgpt_tokens
    # Shared CNPG cluster; the URL is sslmode=require, which Prisma only
    # validates against the cluster CA when it is passed as sslcert (trust-manager root-ca)
    - name: DATABASE_BASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-postgres
          key: url
    - name: DATABASE_URL
      value: $(DATABASE_BASE_URL)&sslcert=/etc/ssl/root-ca/ca.crt
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://idm.negative7.com/ui/oauth2
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: GENERIC_SCOPE
      value: openid profile email
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://idm.negative7.com/oauth2/token
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: email
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://idm.negative7.com/oauth2/openid/litellm/userinfo
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
    - name: LITELLM_MODE
      value: PRODUCTION
    # Encrypts provider credentials stored in the database. Must never change
    # once the database holds data.
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_SALT_KEY
    - name: PROXY_BASE_URL
      value: https://litellm.negative7.com
    - name: REDIS_HOST
      value: litellm-dragonfly.ai.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
  envFrom:
    - secretRef:
        name: litellm-kanidm-oauth2-credentials
  generalSettings:
    # SSO (Kanidm) is the only Admin UI login; the master key no longer works
    # as the UI password but still authenticates API calls.
    disable_env_credential_login: true
    store_model_in_db: false
    # Envoy gateway pods sit in the pod CIDR; trusting them lets the Admin UI
    # login throttle key on the real client address from X-Forwarded-For.
    trusted_proxy_ranges:
      - 10.244.0.0/16
  litellmSettings:
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      ttl: 300
      supported_call_types:
        - embedding
        - aembedding
    drop_params: true
    failure_callback:
      - prometheus
    merge_reasoning_content_in_choices: true
    num_retries: 2
    prometheus_adapter: true
    request_timeout: 900
    retry_after: 5
    set_verbose: false
    success_callback:
      - prometheus
  # Egress is world-only via the label; litellm-specific allows live in
  # ciliumnetworkpolicy.yaml
  podLabels:
    egress.policy.home.arpa/internet: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  route:
    hostnames:
      - litellm.negative7.com
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: envoy-internal
        namespace: network
  routerSettings:
    cooldown_time: 30
    enable_pre_call_checks: true
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    routing_strategy: simple-shuffle
  service:
    type: ClusterIP
    port: 4000
  volumeMounts:
    - name: cache
      mountPath: /app/cache
    - name: litellm
      mountPath: /app/chatgpt_tokens
      subPath: chatgpt_tokens
    - name: root-ca
      mountPath: /etc/ssl/root-ca
      readOnly: true
  volumes:
    - name: cache
      emptyDir: {}
    - name: litellm
      persistentVolumeClaim:
        claimName: litellm
    - name: root-ca
      secret:
        secretName: root-ca
