---
# Custom client (not components/kanidm-oidc): LiteLLM reads its UI role from the `litellm_role` claim
# and wants GENERIC_CLIENT_ID/GENERIC_CLIENT_SECRET, so the secret is consumed with a plain envFrom.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: litellm
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: LiteLLM
  origin: https://litellm.negative7.com/
  redirectUrl:
    - https://litellm.negative7.com/sso/callback
  scopeMap:
    - group: admins
      scopes:
        - openid
        - profile
        - email
  # csv keeps the single value a plain string, which is what LiteLLM expects.
  claimMap:
    - name: litellm_role
      valuesMap:
        - group: admins
          values:
            - proxy_admin
      joinStrategy: csv
  # PKCE stays enforced; LiteLLM sends an S256 challenge when GENERIC_CLIENT_USE_PKCE=true.
  preferShortUsername: true
  strictRedirectUrl: true
  secretKeyAliases:
    clientId:
      - GENERIC_CLIENT_ID
    clientSecret:
      - GENERIC_CLIENT_SECRET
  image:
    url: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/litellm.svg
