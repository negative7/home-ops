---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmteam_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: hermes
spec:
  alias: hermes
  # LiteLLM gives virtual keys no MCP servers unless granted. Names are the `alias` of each
  # LiteLLMMCPServer in litellm/app/mcp-servers (kguardian is not deployed); all run read-only.
  mcpServers:
    - context7
    - flux
    - grafana
    - home_assistant
    - konflate
    - kubectl
    - kubesearch
    - sidero
    - unifi_network
    - victoria_logs
  models:
    - neuralwatt/dsv4.1f
  proxyNamespace: ai
  proxyRef: litellm
