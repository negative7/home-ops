---
_config_version: 46

providers:
  litellm:
    name: LiteLLM
    api: http://litellm.ai.svc.cluster.local:4000/v1
    key_env: LITELLM_API_KEY
    transport: chat_completions
    discover_models: true

model:
  api_key: ${LITELLM_API_KEY}
  base_url: http://litellm.ai.svc.cluster.local:4000/v1
  default: neuralwatt/dsv4.1f
  provider: litellm

web:
  search_backend: searxng
  # Firecrawl cloud for page extraction (FIRECRAWL_API_KEY from the hermes secret), as in bjw-s
  extract_backend: firecrawl

# MCP: memini (agent memory, no auth, cluster-internal) and the LiteLLM MCP gateway, which
# exposes only the servers granted to the hermes team (all read-only).
mcp_servers:
  memini:
    url: http://memini.ai.svc.cluster.local:8080/mcp
  homelab:
    url: http://litellm.ai.svc.cluster.local:4000/mcp
    headers:
      Authorization: "Bearer ${LITELLM_API_KEY}"

secrets:
  command:
    enabled: true
    command: |
      printf 'LITELLM_API_KEY=%s\n' "$LITELLM_API_KEY"
    helper_timeout_seconds: 3
    override_existing: true

security:
  redact_secrets: true

terminal:
  backend: local
  cwd: /opt/data/workspace
  persistent_shell: true
  timeout: 180

timezone: America/New_York

privacy:
  redact_pii: true

approvals:
  mode: smart

toolsets:
  - hermes-cli
  - kanban

# memini (mcp_servers.memini) is the only memory store; turn off Hermes's built-in memory so the
# model cannot pick it and the background review does not write MEMORY.md/USER.md.
memory:
  memory_enabled: false
  user_profile_enabled: false
  nudge_interval: 0

agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
  disabled_toolsets:
    - a2a
    - browser
    - computer_use
    - desktop_ui
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    # Built-in MEMORY.md/USER.md; memini (MCP) is the only memory
    - memory
    - spotify
    - video
    - video_gen
    - x_search
    - yuanbao

platform_toolsets:
  cli:
    - clarify
    - code_execution
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web

telemetry:
  shared_metrics:
    enabled: false

gateway:
  multiplex_profiles: true

streaming:
  enabled: true
