---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: offsite-backup
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: offsite-backup-secret
    creationPolicy: Owner
    template:
      data:
        # Garage on lviv, read-only key on the kopiur, cnpg-backups and sergiy-pc buckets
        RCLONE_CONFIG_GARAGE_TYPE: s3
        RCLONE_CONFIG_GARAGE_PROVIDER: Other
        RCLONE_CONFIG_GARAGE_ENDPOINT: http://lviv.homelab.internal:9000
        RCLONE_CONFIG_GARAGE_REGION: us-east-1
        RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: "{{ .GARAGE_ACCESS_KEY_ID }}"
        RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: "{{ .GARAGE_SECRET_ACCESS_KEY }}"
        # B2 application key scoped to the bucket, without deleteFiles: deletes only hide
        # file versions, and the bucket lifecycle rule removes hidden versions later
        RCLONE_CONFIG_B2_TYPE: b2
        RCLONE_CONFIG_B2_ACCOUNT: "{{ .B2_KEY_ID }}"
        RCLONE_CONFIG_B2_KEY: "{{ .B2_APPLICATION_KEY }}"
        # Passwords are stored `rclone obscure`d, which is what rclone expects here
        RCLONE_CONFIG_B2CRYPT_TYPE: crypt
        RCLONE_CONFIG_B2CRYPT_REMOTE: "b2:{{ .B2_BUCKET }}/crypt"
        RCLONE_CONFIG_B2CRYPT_PASSWORD: "{{ .CRYPT_PASSWORD }}"
        RCLONE_CONFIG_B2CRYPT_PASSWORD2: "{{ .CRYPT_SALT }}"
        B2_BUCKET: "{{ .B2_BUCKET }}"
  dataFrom:
    - extract:
        key: offsite-backup
