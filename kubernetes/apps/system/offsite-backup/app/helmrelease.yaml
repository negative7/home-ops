---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: offsite-backup
spec:
  chartRef:
    kind: OCIRepository
    name: offsite-backup
  interval: 30m
  values:
    controllers:
      offsite-backup:
        type: cronjob
        cronjob:
          # after kopiur full maintenance (03:00 + up to 1h jitter)
          schedule: "30 5 * * *"
          timeZone: America/New_York
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        containers:
          app:
            image:
              # ghcr.io/rclone/rclone stopped at 1.73.x
              repository: docker.io/rclone/rclone
              tag: 1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - "/bin/sh"
              - "-c"
            args:
              - |
                rc=0
                count() { rclone size --json "$1" | sed -n 's/.*"count":\([0-9]*\).*/\1/p'; }
                # Skip a bucket whose source holds under half the objects already in B2, so a wiped
                # Garage fails the job instead of hiding the off-site copy (Kopia maintenance alone
                # hides up to ~35% of kopiur a night)
                guarded_sync() {
                  src=$(count "$1"); dst=$(count "$2")
                  if [ -z "$src" ] || [ -z "$dst" ]; then
                    echo "ERROR: could not count objects in $1 or $2"; return 1
                  fi
                  if [ $((src * 2)) -lt "$dst" ]; then
                    echo "ERROR: $1 has $src objects but $2 has $dst, refusing to sync"; return 1
                  fi
                  rclone sync "$1" "$2"
                }
                # Kopia already encrypts the repo; kept plain so Kopia can connect to B2 directly in a disaster
                guarded_sync garage:kopiur "b2:${B2_BUCKET}/kopiur" || rc=1
                guarded_sync garage:cnpg-backups b2crypt:cnpg-backups || rc=1
                guarded_sync garage:sergiy-pc b2crypt:sergiy-pc || rc=1
                guarded_sync garage:kanidm b2crypt:kanidm || rc=1
                exit $rc
            env:
              TZ: America/New_York
              HOME: /tmp
              RCLONE_CONFIG: /tmp/rclone.conf
              RCLONE_FAST_LIST: "true"
              RCLONE_TRANSFERS: "32"
              RCLONE_CHECKERS: "48"
              RCLONE_STATS: 5m
              RCLONE_STATS_LOG_LEVEL: NOTICE
              RCLONE_STATS_ONE_LINE: "true"
            envFrom:
              - secretRef:
                  name: offsite-backup-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 1Gi
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          offsite-backup:
            app:
              - path: /tmp
                subPath: tmp
