---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.1
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
    - apiVersion: miroir.home-operations.com/v1alpha1
      kind: MiroirVolume
      description: All Miroir volumes Ready, connected, no split-brain, DRBD replicas UpToDate
      expr: |-
        status.phase == 'Ready' && has(status.perNode) && status.perNode.all(n,
          status.perNode[n].connected &&
          !status.perNode[n].splitBrain &&
          (!has(status.perNode[n].diskState) || status.perNode[n].diskState in ['UpToDate', 'Diskless']))
