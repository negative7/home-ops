---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  compression:
    compressor: ${KOPIUR_COMPRESSOR:=zstd-fastest}
  mover:
    # Sized like the source volume (bjw-s pattern) so full restores/deep verifies fit;
    # Ephemeral so the cache only exists while a mover runs
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Ephemeral
      storageClassName: miroir-local
    securityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=2000}
      runAsGroup: ${KOPIUR_MOVER_GID:=2000}
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepHourly: 24
    keepDaily: 7
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  # Keep the staged snapshot PVC off DRBD; it otherwise inherits the source's replicated class
  staging:
    storageClassName: miroir-local
  upload:
    maxParallelFileReads: ${KOPIUR_PARALLELISM:=2}
  verification:
    deep:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      storageClassName: miroir-local
      schedule:
        cron: H 5 1 * *
    quick:
      schedule:
        cron: H 3 * * *
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=miroir}
