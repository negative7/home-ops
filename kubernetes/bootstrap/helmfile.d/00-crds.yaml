---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  args:
    - --include-crds
    - --no-hooks

bases:
  - default.yaml

defaultInherit: default

releases:
  - name: envoy-gateway
    namespace: network

  - name: grafana-operator
    namespace: observability
    labels:
      ocirepository: observability/grafana/operator/ocirepository.yaml

  - name: kopiur
    namespace: system

  - name: kube-prometheus-stack
    namespace: observability

  - name: snapshot-controller
    namespace: kube-system
