---
customization:
  extraKernelArgs:
    - initcall_blacklist=algif_aead_init
    - lsm=lockdown,capability,yama,safesetid,bpf,landlock
    - sysctl.kernel.kexec_load_disabled=1
  systemExtensions:
    officialExtensions:
      - siderolabs/drbd
      - siderolabs/i915
      - siderolabs/intel-ucode
      - siderolabs/nfsrahead
