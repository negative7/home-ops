---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Scan

on:
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/**
      - docker/**
      - .forgejo/scripts/image-scan.sh
      - .forgejo/workflows/image-scan.yaml

concurrency:
  group: ${{ forgejo.ref }}-${{ forgejo.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Informational for now: a download, scan or API error must not fail the check and block
      # Renovate automerge. Remove continue-on-error from both steps when enabling GATE.
      # The action only saves its cache when it runs the install itself, so install here
      # (GitHub downloads are ~350 kB/s per connection from home).
      - name: Setup mise
        continue-on-error: true
        uses: https://github.com/jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
          install_args: github:home-operations/flate aqua:aquasecurity/trivy aqua:jqlang/jq

      - name: Scan changed images
        continue-on-error: true
        shell: bash
        env:
          BASE_REF: ${{ forgejo.base_ref }}
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          # post as negative7-bot (same account as konflate); falls back to the job token
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN || forgejo.token }}
          PR_NUMBER: ${{ forgejo.event.pull_request.number }}
        run: .forgejo/scripts/image-scan.sh
