---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
services:
  garage:
    container_name: garage
    image: docker.io/dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command:
      - /garage
      - "-c"
      - /etc/garage/garage.toml
      - server
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: host
    environment:
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/garage.toml:/etc/garage/garage.toml:ro
      - /mnt/tank/apps/garage/meta:/var/lib/garage/meta
      - /mnt/tank/apps/garage/data:/var/lib/garage/data

  garage-webui:
    container_name: garage-webui
    hostname: garage.internal
    image: docker.io/khairul169/garage-webui:1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
    restart: unless-stopped
    logging:
      driver: json-file
    # Bridge networking, published on VLAN20 only
    ports:
      - 10.2.0.10:3909:3909
    environment:
      - PORT=3909
      - API_BASE_URL=http://10.2.0.10:9002
      - S3_ENDPOINT_URL=http://10.2.0.10:9000
      - S3_REGION=us-east-1
      - API_ADMIN_KEY=${GARAGE_ADMIN_TOKEN}
    volumes:
      - /etc/localtime:/etc/localtime:ro
