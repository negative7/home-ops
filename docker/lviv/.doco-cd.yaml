---
working_dir: ./docker/lviv
# Webhooks fire for every branch push; only deploy main
reference: refs/heads/main
webhook_filter: ^refs/heads/main$
auto_discovery:
  enabled: true
  depth: 1
  delete: true
external_secrets:
  PROTONVPN_WIREGUARD_PRIVATE_KEY: op://lviv/protonvpn/private_key
  PROTONVPN_WIREGUARD_ADDRESSES: op://lviv/protonvpn/addresses
  GARAGE_ADMIN_TOKEN: op://lviv/garage/admin_token
  GARAGE_RPC_SECRET: op://lviv/garage/rpc_secret
  GARAGE_METRICS_TOKEN: op://lviv/garage/metrics_token
  GARAGE_UI_OIDC_CLIENT_ID: op://lviv/garage_ui/oidc_client_id
  GARAGE_UI_OIDC_CLIENT_SECRET: op://lviv/garage_ui/oidc_client_secret
  LVIV_KOPIA_PASSWORD: op://lviv/lviv_kopia/password
  LVIV_KOPIA_B2_KEY_ID: op://lviv/lviv_kopia/b2_key_id
  LVIV_KOPIA_B2_KEY: op://lviv/lviv_kopia/b2_key
  LVIV_KOPIA_B2_BUCKET: op://lviv/lviv_kopia/b2_bucket
force_recreate: false
reconciliation:
  enabled: true
  interval: 3600
