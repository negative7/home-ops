---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
version: "3.2"
services:
  sabnzbd:
    container_name: sabnzbd
    hostname: sabnzbd.internal
    image: ghcr.io/home-operations/sabnzbd:5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 10.2.0.10:6060:6060
    environment:
      - SABNZBD__HOST_WHITELIST_ENTRIES=lviv.homelab.internal, sabnzbd.negative7.com
      - SABNZBD__PORT=6060
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/sabnzbd:/config
      - /mnt/tank/data/usenet:/data/usenet:rw
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - "http://localhost:6060/"
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  gluetun:
    container_name: gluetun
    hostname: gluetun.internal
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    restart: unless-stopped
    logging:
      driver: json-file
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    ports:
      - 10.2.0.10:8080:8080
      - 10.2.0.10:7476:7476
    environment:
      - TZ=America/New_York
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=United States
      - PORT_FORWARD_ONLY=on
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${PROTONVPN_WIREGUARD_ADDRESSES}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - FIREWALL_INPUT_PORTS=8080,7476
      - FIREWALL_OUTBOUND_SUBNETS=10.2.0.0/24
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/gluetun:/gluetun
    healthcheck:
      test:
        - CMD
        - /gluetun-entrypoint
        - healthcheck
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/home-operations/qbittorrent:5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/qbittorrent:/config
      - /mnt/tank/data/torrents:/data/torrents:rw
    # Fails when gluetun's control server is unreachable, i.e. this container is stuck in the
    # netns of a gluetun that was restarted alone (doco-cd then restarts it into the current one).
    # Also re-applies the forwarded port when gluetun's up command ran while qBittorrent was down
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://localhost:8080/api/v2/app/version &&
          p=$$(curl -fsS http://127.0.0.1:8000/v1/portforward | jq -r .port) &&
          if [ "$$p" -gt 0 ] && [ "$$(curl -fsS http://localhost:8080/api/v2/app/preferences | jq -r '"\(.listen_port) \(.current_network_interface)"')" != "$$p tun0" ]; then
          curl -fsS -o /dev/null --data "json={\"listen_port\":$$p,\"current_network_interface\":\"tun0\",\"random_port\":false,\"upnp\":false}" http://localhost:8080/api/v2/app/setPreferences;
          fi
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  qui:
    container_name: qui
    image: ghcr.io/autobrr/qui:v1.34.0@sha256:e320bfff0780caff49fee18a6738659c629f863f2dd9347f32b41d287eddde25
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/qui:/config
    # Fails when stuck in the netns of a gluetun that was restarted alone (see qbittorrent)
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://localhost:7476/health && curl -fsS -o /dev/null http://127.0.0.1:8000/v1/portforward
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  autobrr:
    container_name: autobrr
    hostname: autobrr.internal
    image: ghcr.io/autobrr/autobrr:v1.89.0@sha256:60efc357e1852f1cd337b8c26d65c5299feadbb4f364c89299b1eede5d159ce4
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 10.2.0.10:7474:7474
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/autobrr:/config
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - "http://localhost:7474/api/healthz/liveness"
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
