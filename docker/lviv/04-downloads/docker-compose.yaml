---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
version: "3.2"
services:
  sabnzbd:
    container_name: sabnzbd
    hostname: sabnzbd.internal
    image: ghcr.io/home-operations/sabnzbd:5.1.2
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 6060:6060
    environment:
      - SABNZBD__HOST_WHITELIST_ENTRIES=lviv.homelab.internal, sabnzbd.negative7.com
      - SABNZBD__PORT=6060
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/sabnzbd:/config
      - /mnt/tank/data/usenet:/data/usenet:rw
    healthcheck:
      test: [CMD, curl, -f, "http://localhost:6060/"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  gluetun:
    container_name: gluetun
    hostname: gluetun.internal
    image: qmcgaw/gluetun:v3.41.3
    restart: unless-stopped
    logging:
      driver: json-file
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    ports:
      - 8080:8080
      - 7476:7476
    environment:
      - TZ=America/New_York
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=United States
      - PORT_FORWARD_ONLY=on
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${PROTONVPN_WIREGUARD_ADDRESSES}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - FIREWALL_INPUT_PORTS=8080,7476
      - FIREWALL_OUTBOUND_SUBNETS=10.2.0.0/24
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/gluetun:/gluetun
    healthcheck:
      test: [CMD, /gluetun-entrypoint, healthcheck]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/home-operations/qbittorrent:5.2.3
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/qbittorrent:/config
      - /mnt/tank/data/torrents:/data/torrents:rw
    healthcheck:
      test: [CMD, curl, -f, "http://localhost:8080/api/v2/app/version"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  qui:
    container_name: qui
    image: ghcr.io/autobrr/qui:v1.26.0
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/qui:/config

  autobrr:
    container_name: autobrr
    hostname: autobrr.internal
    image: ghcr.io/autobrr/autobrr:v1.84.0
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 7474:7474
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/autobrr:/config
    healthcheck:
      test: [CMD, curl, -f, "http://localhost:7474/api/healthz/liveness"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
