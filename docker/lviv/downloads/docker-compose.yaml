---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
version: "3.2"
services:
  sabnzbd:
    container_name: sabnzbd
    hostname: sabnzbd.internal
    image: ghcr.io/home-operations/sabnzbd:5.0.4
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 6060:6060
    environment:
      - SABNZBD__HOST_WHITELIST_ENTRIES=lviv.homelab.internal, sabnzbd.negative7.com
      - SABNZBD__PORT=6060
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/sabnzbd:/config
      - /mnt/tank/data/usenet:/data/usenet:rw

  # ProtonVPN WireGuard tunnel for qbittorrent/qui. Gluetun's firewall drops
  # all non-tunnel traffic by default, acting as the killswitch.
  gluetun:
    container_name: gluetun
    hostname: gluetun.internal
    image: qmcgaw/gluetun:v3.41.1
    restart: unless-stopped
    logging:
      driver: json-file
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080 # qbittorrent webui
      - 7476:7476 # qui webui
    environment:
      - TZ=America/New_York
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=United States
      # Only pick servers that support port forwarding, since we rely on it below.
      - PORT_FORWARD_ONLY=on
      # Resolved via external_secrets in docker/lviv/.doco-cd.yaml (1Password home-cluster vault).
      # This key works for all ProtonVPN servers, no special generation flags needed.
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${PROTONVPN_WIREGUARD_ADDRESSES}
      - VPN_PORT_FORWARDING=on
      # qBittorrent WebUI must have "Bypass authentication for clients on localhost" enabled
      # (Settings > WebUI) so these unauthenticated localhost requests from gluetun succeed.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      # Opens the WebUI ports through gluetun's own firewall (killswitch blocks everything else)
      # and allows responses back out to the LAN. Adjust the subnet if lviv's LAN differs.
      # The forwarded torrent peer port is opened automatically since protonvpn is a native
      # gluetun integration (no FIREWALL_VPN_INPUT_PORTS needed).
      - FIREWALL_INPUT_PORTS=8080,7476
      - FIREWALL_OUTBOUND_SUBNETS=10.2.0.0/24
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/gluetun:/gluetun
    healthcheck:
      test: [CMD, /gluetun-entrypoint, healthcheck]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/home-operations/qbittorrent:5.2.3
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/qbittorrent:/config
      - /mnt/tank/data/torrents:/data/torrents:rw

  # Modern qbittorrent WebUI, shares gluetun's network namespace so it can
  # reach qbittorrent over localhost.
  qui:
    container_name: qui
    image: ghcr.io/autobrr/qui:v1.23.0
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/qui:/config

  # Runs directly on the LAN (not through the VPN) since most private
  # trackers require your real/whitelisted IP for indexer and IRC access.
  autobrr:
    container_name: autobrr
    hostname: autobrr.internal
    image: ghcr.io/autobrr/autobrr:v1.83.0
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 7474:7474
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/tank/apps/autobrr:/config
