---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
services:
  # Pull-through cache for the Talos nodes (RegistryMirrorConfig); anonymous read-only, VLAN20 only
  zot:
    container_name: zot
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.22@sha256:46f688dc26315a35a247e1784368829e66a67bf91de94c7d8d1645044fac1d5b
    user: "2000:2000"
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 10.2.0.10:5000:5000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/config.json:/etc/zot/config.json:ro
      - /mnt/tank/apps/zot:/var/lib/registry
