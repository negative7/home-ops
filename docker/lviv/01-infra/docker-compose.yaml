---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
services:
  dockhand:
    container_name: dockhand
    hostname: dockhand.internal
    image: fnsys/dockhand:v1.0.56@sha256:e82db7e76024d288c40a96ed023537961cfa4e60f1a87087f1990f64bde39fac
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 10.2.0.10:3000:3000
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/tank/apps/dockhand:/app/data
