---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
services:
  dockhand:
    container_name: dockhand
    hostname: dockhand.internal
    image: fnsys/dockhand:v1.0.55@sha256:039fbb65899f5ecc1d63083736d94587306b35736bca666eca623416859ddaa5
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 10.2.0.10:3000:3000
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/tank/apps/dockhand:/app/data
