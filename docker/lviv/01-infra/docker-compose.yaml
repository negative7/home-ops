---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
services:
  dockhand:
    container_name: dockhand
    hostname: dockhand.internal
    image: fnsys/dockhand:v1.0.58@sha256:515c6e0f28cf3922c51a2dfd3463b972880e40418c2464b1bc91b8a3afe66c7f
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 10.2.0.10:3000:3000
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/tank/apps/dockhand:/app/data
