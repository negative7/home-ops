---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
services:
  dockhand:
    container_name: dockhand
    hostname: dockhand.internal
    image: fnsys/dockhand:v1.0.57@sha256:4fd64d32728c99e5caf39b952a17d85448ee0b8ae76e0961f719ba2e19013988
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - 10.2.0.10:3000:3000
    environment:
      - TZ=America/New_York
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/tank/apps/dockhand:/app/data
