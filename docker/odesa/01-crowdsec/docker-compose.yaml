---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/refs/heads/main/schema/compose-spec.json
name: crowdsec

services:
  crowdsec:
    # -debian variant ships journalctl, which the journald acquisition shells out to
    image: ghcr.io/crowdsecurity/crowdsec:v1.8.2-debian@sha256:a5642c72127ee93aaac830e9f66891573fa7851b2c721987d9fef13d7d05fdfe
    container_name: crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd crowdsecurity/iptables"
      PARSERS: "crowdsecurity/geoip-enrich"
      GID: "1000"
    volumes:
      - /var/log:/var/log:ro
      - /run/systemd/journal:/run/systemd/journal:ro
      # journalctl only opens /var/log/journal/<machine-id> for the local machine-id
      - /etc/machine-id:/etc/machine-id:ro
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - ./scenarios:/etc/crowdsec/scenarios/custom:ro
      - ./whitelists:/etc/crowdsec/parsers/s02-enrich/custom:ro
      # crowdsec does not recurse into subdirectories of acquis.d
      - ./acquis.d:/etc/crowdsec/acquis.d:ro
      - ./config/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
    ports:
      - "127.0.0.1:8088:8080"
      # Prometheus metrics, proxied to home by 04-exporters
      - "127.0.0.1:6060:6060"
    healthcheck:
      test:
        - "CMD"
        - "cscli"
        - "lapi"
        - "status"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crowdsec-db:
  crowdsec-config:

networks:
  default:
    name: edge
    external: true
