---
working_dir: ./docker/odesa
# Webhooks fire for every branch push; only deploy main
reference: refs/heads/main
webhook_filter: ^refs/heads/main$
auto_discovery:
  enabled: true
  depth: 1
  delete: true
external_secrets:
  GATUS_PUSHOVER_TOKEN: op://odesa/pushover/PUSHOVER_TOKEN
  GATUS_PUSHOVER_KEY: op://odesa/pushover/PUSHOVER_USER_KEY
  GATUS_HEARTBEAT_TOKEN: op://odesa/odesa/heartbeat_token
  CADDY_ACME_EMAIL: op://odesa/odesa/acme_email
force_recreate: false
reconciliation:
  enabled: true
  interval: 3600
