---
- name: Bootstrap Debian
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_user: nasadmin
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping:

    # NetworkManager is the only network manager. VLAN20 (enp3s0) owns the main table and the
    # default route; VLAN1 (eno1) routes live in table 1, used only for traffic sourced from
    # 10.0.1.10, so replies leave the NIC they arrived on
    - name: network
      vars:
        legacy_nm_profiles:
          - "Wired connection 1"
          - "Wired connection 2"
          - "enp3s0"
          - "enp3s0.4"
      block:
        - name: network | Leave only loopback to ifupdown
          ansible.builtin.copy:
            dest: /etc/network/interfaces
            content: |
              # Managed by ansible; NICs are managed by NetworkManager
              source /etc/network/interfaces.d/*

              auto lo
              iface lo inet loopback
            owner: root
            group: root
            mode: "0644"

        - name: network | Stop NetworkManager creating "Wired connection" profiles
          ansible.builtin.copy:
            dest: /etc/NetworkManager/conf.d/no-auto-default.conf
            content: |
              [main]
              no-auto-default=*
            owner: root
            group: root
            mode: "0644"

        - name: network | VLAN20 profile (main table, default route)
          community.general.nmcli:
            type: ethernet
            conn_name: vlan20
            ifname: enp3s0
            method4: auto
            route_metric4: 100
            method6: disabled
            autoconnect: true
            state: present

        - name: network | VLAN1 profile (table 1, source-routed)
          community.general.nmcli:
            type: ethernet
            conn_name: vlan1
            ifname: eno1
            method4: auto
            never_default4: true
            route_metric4: 200
            routes4_extended:
              - ip: 0.0.0.0/0
                next_hop: 10.0.1.1
                table: 1
              - ip: 10.0.1.0/24
                table: 1
            routing_rules4:
              - priority 100 from 10.0.1.10 table 1
            method6: disabled
            autoconnect: true
            state: present

        - name: network | Find legacy profiles still present
          ansible.builtin.command: nmcli -g NAME connection show
          register: nm_profiles
          changed_when: false

        # Deleting the active profiles drops both links (and this SSH session), so a transient
        # unit does the delete and the reboot outside the session
        - name: network | Remove legacy profiles and reboot onto the new ones
          ansible.builtin.reboot:
            reboot_command: >-
              systemd-run --no-block --unit=lviv-network-cutover sh -c
              "nmcli connection delete {{ legacy_nm_profiles | select('in', nm_profiles.stdout_lines) | map('quote') | join(' ') }}; systemctl reboot"
            reboot_timeout: 600
          when: legacy_nm_profiles | select("in", nm_profiles.stdout_lines) | list | length > 0

    # Services listen on VLAN20 only; VLAN1 (eno1) carries SSH and Samba, enforced by its own nftables table
    - name: services
      vars:
        vlan20_ip: 10.2.0.10
        vlan1_interface: eno1
        nfs_exports:
          - path: /mnt/tank/data
            fsid: aa97f48c-9715-4e14-9a52-0517f1ed5438
            clients: 10.2.0.0/24
            options: rw,sync,no_subtree_check
          - path: /mnt/tank/data/immich
            fsid: 7c5941bd-898b-4626-9e5d-14202926a1a8
            clients: 10.2.0.0/24
            options: rw,sync,no_subtree_check
          - path: /mnt/tank/backups/plex
            fsid: 86a3b8c1-486d-4dba-9c87-a1c1496707ea
            clients: 10.2.0.0/24
            options: rw,sync,no_subtree_check
          - path: /mnt/tank/backups/adguard
            fsid: f11a6dff-f103-4386-8de0-2673ea390f12
            clients: 10.0.5.3
            options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000
        smb_shares:
          - {name: data, path: /mnt/tank/data}
          - {name: backups, path: /mnt/tank/backups}
          - {name: paperless, path: /mnt/tank/data/paperless, force_user: apps, force_group: apps}
      block:
        # Lets services bind 10.2.0.10 at boot before DHCP has assigned it
        - name: services | Allow binding addresses that are not up yet
          ansible.builtin.copy:
            dest: /etc/sysctl.d/60-nonlocal-bind.conf
            content: |
              net.ipv4.ip_nonlocal_bind = 1
            owner: root
            group: root
            mode: "0644"
          notify: Apply sysctl

        - name: services | Config directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - /etc/nfs.conf.d
            - /etc/nftables.d

        - name: services | Publish Docker ports on VLAN20 only
          ansible.builtin.copy:
            dest: /etc/docker/daemon.json
            content: "{{ {'ip': vlan20_ip} | to_nice_json }}\n"
            owner: root
            group: root
            mode: "0644"
          notify: Restart docker

        - name: services | NFS exports
          ansible.builtin.template:
            src: templates/exports.j2
            dest: /etc/exports.d/home-ops.exports
            owner: root
            group: root
            mode: "0644"
          notify: Reload NFS exports

        - name: services | NFSv4 only
          ansible.builtin.copy:
            dest: /etc/nfs.conf.d/home-ops.conf
            content: |
              [nfsd]
              vers3=n
            owner: root
            group: root
            mode: "0644"
          notify: Restart NFS server

        - name: services | Mask NFSv3 helpers
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            masked: true
            state: stopped
          loop:
            - rpcbind.socket
            - rpcbind.service
            - rpc-statd.service

        - name: services | Samba config
          ansible.builtin.template:
            src: templates/smb.conf.j2
            dest: /etc/samba/smb.conf
            owner: root
            group: root
            mode: "0644"
            validate: testparm -s %s
          notify: Restart Samba

        # upsmon on lviv talks to localhost; hass and nut_exporter use 10.2.0.10
        - name: services | NUT listens on loopback and VLAN20
          ansible.builtin.copy:
            dest: /etc/nut/upsd.conf
            content: |
              LISTEN 127.0.0.1 3493
              LISTEN {{ vlan20_ip }} 3493
            owner: root
            group: nut
            mode: "0640"
          notify: Restart NUT

        - name: services | VLAN1 firewall rules
          ansible.builtin.template:
            src: templates/vlan1-firewall.nft.j2
            dest: /etc/nftables.d/vlan1-firewall.nft
            owner: root
            group: root
            mode: "0644"
          notify: Restart VLAN1 firewall

        # Not nftables.service: its ExecStop flushes the whole ruleset, Docker's included
        - name: services | VLAN1 firewall unit
          ansible.builtin.copy:
            dest: /etc/systemd/system/vlan1-firewall.service
            content: |
              [Unit]
              Description=nftables input filter for the VLAN1 interface
              Wants=network-pre.target
              Before=network-pre.target

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/usr/sbin/nft -f /etc/nftables.d/vlan1-firewall.nft
              ExecStop=/usr/sbin/nft delete table inet vlan1_firewall

              [Install]
              WantedBy=multi-user.target
            owner: root
            group: root
            mode: "0644"
          notify: Restart VLAN1 firewall

        - name: services | Enable VLAN1 firewall
          ansible.builtin.systemd_service:
            name: vlan1-firewall.service
            enabled: true
            daemon_reload: true

    # Datasets are created by hand (moving data in needs a copy and a stop); this only enforces
    # their tuned properties. Byte-sized values are re-set every run, which is a no-op
    - name: zfs
      tags:
        - zfs
      vars:
        zfs_textfile_dir: /var/lib/node-exporter/textfile
        zfs_datasets:
          - name: tank
            properties: {dnodesize: auto}
          - name: tank/apps
            properties: {compression: zstd}
          # Cap so a runaway backup job can't fill the pool (includes the sanoid snapshots)
          - name: tank/apps/garage
            properties: {quota: 500G}
          - name: tank/apps/garage/meta
            properties: {recordsize: 16K}
          # Garage blocks are already zstd-compressed
          - name: tank/apps/garage/data
            properties: {recordsize: 1M, compression: lz4}
          - name: tank/backups
            properties: {sync: standard, recordsize: 1M}
          - name: tank/data/immich
            properties: {recordsize: 1M}
          - name: tank/home
            properties: {compression: zstd}
          # Emergency headroom: zfs set refreservation=none tank/reserved
          - name: tank/reserved
            properties: {refreservation: 300G, mountpoint: none}
      block:
        - name: zfs | Dataset properties
          community.general.zfs:
            name: "{{ item.name }}"
            state: present
            extra_zfs_properties: "{{ item.properties }}"
          loop: "{{ zfs_datasets }}"
          loop_control:
            label: "{{ item.name }}"

        - name: zfs | Read autotrim
          ansible.builtin.command: zpool get -H -o value autotrim tank
          register: zpool_autotrim
          changed_when: false
          check_mode: false

        # HDD-only pool
        - name: zfs | Disable autotrim
          ansible.builtin.command: zpool set autotrim=off tank
          changed_when: true
          when: zpool_autotrim.stdout != "off"

        - name: zfs | Install sanoid
          ansible.builtin.apt:
            name: sanoid
            state: present
            update_cache: true
            cache_valid_time: 3600

        # The Debian package ships no /etc/sanoid
        - name: zfs | Sanoid config directory
          ansible.builtin.file:
            path: /etc/sanoid
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: zfs | Sanoid config
          ansible.builtin.template:
            src: templates/sanoid.conf.j2
            dest: /etc/sanoid/sanoid.conf
            owner: root
            group: root
            mode: "0644"

        - name: zfs | Enable sanoid timer
          ansible.builtin.systemd_service:
            name: sanoid.timer
            enabled: true
            state: started

        # node-exporter (docker/lviv/02-exporters) reads this through its /host/root bind mount
        - name: zfs | Textfile collector directory
          ansible.builtin.file:
            path: "{{ zfs_textfile_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: zfs | Metrics script
          ansible.builtin.template:
            src: templates/zfs-metrics.sh.j2
            dest: /usr/local/bin/zfs-metrics
            owner: root
            group: root
            mode: "0755"

        - name: zfs | Metrics units
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.name }}"
            content: "{{ item.content }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - name: zfs-metrics.service
              content: |
                [Unit]
                Description=Write ZFS pool and snapshot metrics for node-exporter

                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/zfs-metrics
            - name: zfs-metrics.timer
              content: |
                [Unit]
                Description=Write ZFS pool and snapshot metrics every 5 minutes

                [Timer]
                OnBootSec=1min
                OnUnitActiveSec=5min

                [Install]
                WantedBy=timers.target
          loop_control:
            label: "{{ item.name }}"

        - name: zfs | Enable metrics timer
          ansible.builtin.systemd_service:
            name: zfs-metrics.timer
            enabled: true
            state: started
            daemon_reload: true

    # Debian + Debian-Security origins only (the stock 50unattended-upgrades): Docker, zfs-dkms
    # (backports) and the other third-party repos stay manual. Reboots after kopiur's 03:00
    # full maintenance; NFS/Garage clients in the cluster just stall for the few minutes it takes
    - name: unattended-upgrades
      tags:
        - unattended-upgrades
      vars:
        auto_reboot_time: "05:00"
        textfile_dir: /var/lib/node-exporter/textfile
      block:
        - name: unattended-upgrades | Install
          ansible.builtin.apt:
            name: unattended-upgrades
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: unattended-upgrades | Enable periodic security upgrades
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/20auto-upgrades
            content: |
              APT::Periodic::Update-Package-Lists "1";
              APT::Periodic::Unattended-Upgrade "1";
            owner: root
            group: root
            mode: "0644"

        - name: unattended-upgrades | Enable timers
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - apt-daily.timer
            - apt-daily-upgrade.timer

        # NodeRebootRequired only fires if this didn't happen (see kube-prometheus-stack prometheusrules)
        - name: unattended-upgrades | Reboot automatically when required
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/52unattended-upgrades-reboot
            content: |
              Unattended-Upgrade::Automatic-Reboot "true";
              Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
              Unattended-Upgrade::Automatic-Reboot-Time "{{ auto_reboot_time }}";
            owner: root
            group: root
            mode: "0644"

        # node_reboot_required for node-exporter's textfile collector (dir is created by the zfs block)
        - name: unattended-upgrades | Reboot-required metric script
          ansible.builtin.copy:
            dest: /usr/local/bin/reboot-required-metric
            content: |
              #!/bin/sh
              # Managed by ansible. unattended-upgrades drops /run/reboot-required when an update needs a reboot
              set -eu
              out={{ textfile_dir }}/reboot.prom
              if [ -f /run/reboot-required ]; then v=1; else v=0; fi
              printf '# HELP node_reboot_required 1 if the host has pending updates that need a reboot.\n# TYPE node_reboot_required gauge\nnode_reboot_required %s\n' "$v" > "$out.tmp"
              mv "$out.tmp" "$out"
            owner: root
            group: root
            mode: "0755"

        - name: unattended-upgrades | Reboot-required metric units
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.name }}"
            content: "{{ item.content }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - name: reboot-required-metric.service
              content: |
                [Unit]
                Description=Write the reboot-required metric for node-exporter

                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/reboot-required-metric
            - name: reboot-required-metric.timer
              content: |
                [Unit]
                Description=Write the reboot-required metric every 5 minutes

                [Timer]
                OnBootSec=1min
                OnUnitActiveSec=5min

                [Install]
                WantedBy=timers.target
          loop_control:
            label: "{{ item.name }}"

        - name: unattended-upgrades | Enable reboot-required metric timer
          ansible.builtin.systemd_service:
            name: reboot-required-metric.timer
            enabled: true
            state: started
            daemon_reload: true

    - name: Read secrets from 1Password
      ansible.builtin.shell: "op read 'op://{{ item.key }}' < /dev/null"
      delegate_to: localhost
      become: false
      loop:
        - key: home-cluster/doco-cd/lviv_sa_token
          var: doco_1pw_sa_token
        - key: home-cluster/doco-cd/api_secret
          var: doco_api_secret
        - key: home-cluster/doco-cd/webhook_secret
          var: doco_webhook_secret
        - key: home-cluster/pbs/admin_password
          var: pbs_admin_password
        - key: home-cluster/pbs/kyiv_password
          var: pbs_kyiv_password
      check_mode: false
      changed_when: false
      no_log: true
      register: secrets_raw

    - name: Set secret facts
      ansible.builtin.set_fact:
        doco_1pw_sa_token: "{{ secrets_raw.results[0].stdout }}"
        doco_api_secret: "{{ secrets_raw.results[1].stdout }}"
        doco_webhook_secret: "{{ secrets_raw.results[2].stdout }}"
        pbs_admin_password: "{{ secrets_raw.results[3].stdout }}"
        pbs_kyiv_password: "{{ secrets_raw.results[4].stdout }}"
      no_log: true

    - name: apps data
      vars:
        apps_data_dir: /mnt/tank/apps
      block:
        - name: apps data | Discover app directories referenced by compose files
          ansible.builtin.set_fact:
            apps_data_dirs: >-
              {{ lookup('ansible.builtin.pipe',
                "grep -rhoE '/mnt/tank/apps/[a-zA-Z0-9_-]+' " ~ playbook_dir ~ "/../../docker/lviv | sort -u | xargs -n1 basename"
              ).splitlines() | difference(['kopia']) }}
          delegate_to: localhost
          become: false
          run_once: true

        - name: apps data | Ensure directories exist with correct ownership
          ansible.builtin.file:
            path: "{{ apps_data_dir }}/{{ item }}"
            state: directory
            owner: apps
            group: apps
            mode: "0755"
          loop: "{{ apps_data_dirs }}"

        # find instead of file/recurse: the module stats every file in Python and takes minutes on large trees
        - name: apps data | Recursively fix ownership
          ansible.builtin.shell: >-
            find {{ apps_data_dir }}/{{ item }} \( ! -user apps -o ! -group apps \)
            -print -exec chown -h apps:apps {} +
          register: apps_chown
          changed_when: apps_chown.stdout | length > 0
          # garage runs as apps (2000:2000) and holds ~62G of small block files; walking it adds minutes for nothing
          loop: "{{ apps_data_dirs | difference(['garage']) }}"

        # kopia runs as root with only DAC_READ_SEARCH (no DAC_OVERRIDE), so it can only write files root owns
        - name: apps data | Kopia config directory
          ansible.builtin.file:
            path: "{{ apps_data_dir }}/kopia"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: apps data | Kopia config ownership
          ansible.builtin.shell: >-
            find {{ apps_data_dir }}/kopia \( ! -user root -o ! -group root \)
            -print -exec chown -h root:root {} +
          register: kopia_chown
          changed_when: kopia_chown.stdout | length > 0

    - name: doco-cd
      vars:
        dococd_config_dir: /home/nasadmin/.config/doco-cd
      block:
        - name: doco-cd | Create directory
          ansible.builtin.file:
            path: "{{ dococd_config_dir }}"
            state: directory
            owner: nasadmin
            group: nasadmin
            mode: "0700"

        - name: doco-cd | Copy docker-compose app file
          ansible.builtin.copy:
            src: ../../docker/lviv/.doco-cd/docker-compose.app.yaml
            dest: "{{ dococd_config_dir }}/docker-compose.yaml"
            owner: nasadmin
            group: nasadmin
            mode: "0644"
          register: compose_file

        - name: doco-cd | Create secrets
          ansible.builtin.copy:
            dest: "{{ dococd_config_dir }}/{{ item.name }}"
            content: |
              {{ item.content }}
            owner: nasadmin
            group: nasadmin
            mode: "0600"
          no_log: true
          loop:
            - name: 1pw_token
              content: "{{ doco_1pw_sa_token }}"
            - name: api_secret
              content: "{{ doco_api_secret }}"
            - name: webhook_secret
              content: "{{ doco_webhook_secret }}"
          register: dococd_secrets

        - name: doco-cd | Run docker-compose
          community.docker.docker_compose_v2:
            project_src: "{{ dococd_config_dir }}"
            files:
              - docker-compose.yaml
            pull: always
            # Secrets are bind-mounted files; a rotated token only reaches the container on recreate
            recreate: "{{ 'always' if dococd_secrets.changed else 'auto' }}"
            state: present
          when: not ansible_check_mode

        - name: doco-cd | Wait for healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

    # Proxmox Backup Server for kyiv (ansible/kyiv backs up to lviv.homelab.internal:8007).
    # Bootstrap: put admin_password and kyiv_password in op://home-cluster/pbs, run this, save
    # the printed fingerprint as pbs/fingerprint, then run kyiv. Retention lives here, not on kyiv.
    # Updates stay manual like Docker: unattended-upgrades only takes Debian origins.
    # The proxy listens on every interface (no bind option); the VLAN1 firewall drops 8007 there
    - name: pbs
      tags:
        - pbs
      vars:
        pbs_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg
        pbs_dataset: tank/pbs
        pbs_path: /mnt/tank/pbs
        pbs_datastore: kyiv
        # kyiv backs up at 02:00 and kopiur runs at 03:00; done before the 05:00 update reboot
        # (an interrupted GC is harmless, it just runs again the next night)
        pbs_gc_schedule: "04:15"
        pbs_homepage_user: homepage@pbs
        pbs_homepage_tokenid: homepage@pbs!homepage
        pbs_jobs:
          - type: prune-job
            id: kyiv-daily
            options: {store: kyiv, schedule: "04:00", keep-daily: 7, keep-weekly: 4}
          # Re-reads each snapshot once its last verify is a month old; Sunday is after the reboot window
          - type: verify-job
            id: kyiv-weekly
            options: {store: kyiv, schedule: "sun 06:00", ignore-verified: true, outdated-after: 30}
        pbs_acls:
          - {path: /, role: Admin, auth_id: admin@pbs}
          - {path: /datastore/kyiv, role: DatastoreBackup, auth_id: kyiv@pbs}
          # Homepage widget: token permissions are the intersection of the user's and the token's
          - {path: /, role: Audit, auth_id: homepage@pbs}
          - {path: /, role: Audit, auth_id: homepage@pbs!homepage}
      block:
        # sha256 from the Proxmox "Install Proxmox VE on Debian 13 Trixie" guide
        - name: pbs | Proxmox archive keyring
          ansible.builtin.get_url:
            url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
            dest: "{{ pbs_keyring }}"
            checksum: sha256:136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
            owner: root
            group: root
            mode: "0644"

        # The Proxmox repo also carries its own systemd, grub, shim, lvm2, smartmontools, ZFS and
        # kernels. Priority 100 lets Debian win wherever both have a package, so only Proxmox-only
        # packages come from it; -1 means its ZFS (backports zfs-dkms must match) and kernels never
        # install. Pinned before the source exists, so no apt run ever sees it unpinned
        - name: pbs | APT pinning and repository
          ansible.builtin.copy:
            dest: "{{ item.dest }}"
            content: "{{ item.content }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - dest: /etc/apt/preferences.d/proxmox
              content: |
                # Managed by ansible
                Package: src:zfs-linux
                Pin: origin download.proxmox.com
                Pin-Priority: -1

                Package: zfs* libzfs* libzpool* libnvpair* libuutil* proxmox-kernel* proxmox-headers* proxmox-default-* linux-tools-* pve-firmware
                Pin: origin download.proxmox.com
                Pin-Priority: -1

                Package: *
                Pin: origin download.proxmox.com
                Pin-Priority: 100
            - dest: /etc/apt/sources.list.d/pbs-no-subscription.sources
              content: |
                # Managed by ansible
                Types: deb
                URIs: http://download.proxmox.com/debian/pbs
                Suites: trixie
                Components: pbs-no-subscription
                Signed-By: {{ pbs_keyring }}
          loop_control:
            label: "{{ item.dest }}"
          register: pbs_apt

        - name: pbs | Refresh APT lists
          ansible.builtin.apt:
            update_cache: true
          when: pbs_apt.changed

        # postfix satisfies PBS's mail-transport-agent dependency; Debian's default ("Internet Site")
        # would listen on :25, Proxmox's own installs keep it loopback-only
        - name: pbs | Postfix local only
          ansible.builtin.debconf:
            name: postfix
            question: postfix/main_mailer_type
            value: Local only
            vtype: select

        # Not the proxmox-backup metapackage (Proxmox kernel + ZFS). No Recommends: they add
        # zfsutils-linux and ifupdown2, which would replace ifupdown under NetworkManager
        - name: pbs | Install
          ansible.builtin.apt:
            name: proxmox-backup-server
            state: present
            install_recommends: false
          register: pbs_install

        # Never use the PBS network UI: it writes /etc/network/interfaces.new, applied at next boot
        - name: pbs | Configure
          when: not (ansible_check_mode and pbs_install.changed)
          block:
            # The package ships the subscription-only repo as a conffile; apt update 401s on it
            - name: pbs | Disable the enterprise repository
              ansible.builtin.lineinfile:
                path: /etc/apt/sources.list.d/pbs-enterprise.sources
                regexp: "^Enabled:"
                line: "Enabled: false"

            # A plain dataset, not under tank/apps or tank/backups: lviv's kopia and the B2 offsite
            # sync never see it, and sanoid skips it (snapshots of a dedup chunk store are just churn).
            # Chunks are already zstd-compressed (lz4 gives up on them cheaply) and up to 4 MiB.
            # GC sets atime explicitly, so atime=off is safe; PBS checks that on create and every GC.
            # Quota for the same reason as Garage
            - name: pbs | Dataset
              community.general.zfs:
                name: "{{ pbs_dataset }}"
                state: present
                extra_zfs_properties:
                  recordsize: 1M
                  compression: lz4
                  atime: "off"
                  quota: 500G

            # proxmox-backup-proxy runs as backup and writes the backup groups into the root
            - name: pbs | Datastore directory owner
              ansible.builtin.file:
                path: "{{ pbs_path }}"
                state: directory
                owner: backup
                group: backup

            - name: pbs | Read current config
              ansible.builtin.command: "proxmox-backup-manager {{ item }} list --output-format json"
              loop:
                - datastore
                - user
                - acl
                - prune-job
                - verify-job
              register: pbs_lists
              changed_when: false
              check_mode: false

            - name: pbs | Parse current config
              ansible.builtin.set_fact:
                pbs_current: >-
                  {{ dict(pbs_lists.results | map(attribute='item')
                     | zip(pbs_lists.results | map(attribute='stdout') | map('from_json'))) }}

            - name: pbs | Datastore
              vars:
                current: "{{ pbs_current.datastore | selectattr('name', 'eq', pbs_datastore) | first | default({}) }}"
              ansible.builtin.command:
                argv: >-
                  {{ ['proxmox-backup-manager', 'datastore']
                     + (['update', pbs_datastore] if current else ['create', pbs_datastore, pbs_path])
                     + ['--gc-schedule', pbs_gc_schedule] }}
              when: current.get('gc-schedule') != pbs_gc_schedule
              changed_when: true

            # The CLI only sets passwords on create (user update ignores --password); change them in the UI
            - name: pbs | Users
              ansible.builtin.command:
                argv: >-
                  {{ ['proxmox-backup-manager', 'user', 'create', item.userid, '--comment', item.comment]
                     + (['--password', item.password] if item.password is defined else []) }}
              loop:
                - {userid: admin@pbs, comment: Administrator, password: "{{ pbs_admin_password }}"}
                - {userid: kyiv@pbs, comment: kyiv Proxmox VE backups, password: "{{ pbs_kyiv_password }}"}
                - {userid: "{{ pbs_homepage_user }}", comment: Homepage widget (API token only)}
              when: item.userid not in (pbs_current.user | map(attribute='userid'))
              changed_when: true
              no_log: true

            - name: pbs | Read Homepage API tokens
              ansible.builtin.command: "proxmox-backup-manager user list-tokens {{ pbs_homepage_user }} --output-format json"
              register: pbs_homepage_tokens
              changed_when: false
              check_mode: false
              when: pbs_homepage_user in (pbs_current.user | map(attribute='userid'))

            # The secret is only shown once, so it goes straight to 1Password (homepage's ExternalSecret
            # reads it); if that fails the token is deleted so the next run makes a new one
            - name: pbs | Homepage API token
              when: >-
                pbs_homepage_tokens is skipped
                or pbs_homepage_tokenid not in (pbs_homepage_tokens.stdout | from_json | map(attribute='tokenid'))
              block:
                - name: pbs | Generate Homepage API token
                  ansible.builtin.command: "proxmox-backup-manager user generate-token {{ pbs_homepage_user }} homepage"
                  register: pbs_homepage_token
                  no_log: true

                - name: pbs | Store Homepage API token in 1Password
                  vars:
                    token: "{{ pbs_homepage_token.stdout | regex_replace('^\\s*Result:\\s*', '') | from_json }}"
                  ansible.builtin.shell: >-
                    op item edit pbs --vault home-cluster
                    {{ ('homepage_token_id[text]=' ~ token.tokenid) | quote }}
                    {{ ('homepage_token_secret[password]=' ~ token.value) | quote }}
                    > /dev/null < /dev/null
                  delegate_to: localhost
                  become: false
                  changed_when: true
                  no_log: true
                  when: not ansible_check_mode
              rescue:
                - name: pbs | Delete the unsaved Homepage API token
                  ansible.builtin.command: "proxmox-backup-manager user delete-token {{ pbs_homepage_user }} homepage"
                  changed_when: true
                  failed_when: false

                - name: pbs | Fail on the Homepage API token
                  ansible.builtin.fail:
                    msg: Could not create the Homepage API token or save it to op://home-cluster/pbs; fix and re-run

            - name: pbs | ACLs
              ansible.builtin.command:
                argv:
                  - proxmox-backup-manager
                  - acl
                  - update
                  - "{{ item.path }}"
                  - "{{ item.role }}"
                  - --auth-id
                  - "{{ item.auth_id }}"
              loop: "{{ pbs_acls }}"
              when: >-
                pbs_current.acl | selectattr('path', 'eq', item.path) | selectattr('ugid', 'eq', item.auth_id)
                | selectattr('roleid', 'eq', item.role) | list | length == 0
              changed_when: true

            - name: pbs | Prune and verify jobs
              vars:
                current: "{{ pbs_current[item.type] | selectattr('id', 'eq', item.id) | first | default({}) }}"
              ansible.builtin.command:
                argv: >-
                  {{ ['proxmox-backup-manager', item.type, 'update' if current else 'create', item.id]
                     + (item.options | dict2items
                        | map(attribute='key') | map('regex_replace', '^', '--')
                        | zip(item.options.values() | map('string') | map('lower'))
                        | flatten) }}
              loop: "{{ pbs_jobs }}"
              loop_control:
                label: "{{ item.id }}"
              when: (current | dict2items | selectattr('key', 'in', item.options | list) | items2dict) != item.options
              changed_when: true

            - name: pbs | Read TLS fingerprint
              ansible.builtin.command: proxmox-backup-manager cert info
              register: pbs_cert
              changed_when: false
              check_mode: false

            # kyiv pins this self-signed cert; it changes if the cert is ever regenerated
            - name: pbs | Store this fingerprint as op://home-cluster/pbs/fingerprint
              ansible.builtin.debug:
                msg: "{{ pbs_cert.stdout_lines | select('search', '(?i)fingerprint') | list }}"

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/60-nonlocal-bind.conf
      changed_when: true

    - name: Restart docker
      ansible.builtin.systemd_service:
        name: docker.service
        state: restarted

    - name: Reload NFS exports
      ansible.builtin.command: exportfs -ra
      changed_when: true

    - name: Restart NFS server
      ansible.builtin.systemd_service:
        name: nfs-server.service
        state: restarted

    - name: Restart Samba
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop:
        - smbd.service
        - nmbd.service

    - name: Restart NUT
      ansible.builtin.systemd_service:
        name: nut-server.service
        state: restarted

    - name: Restart VLAN1 firewall
      ansible.builtin.systemd_service:
        name: vlan1-firewall.service
        state: restarted
        daemon_reload: true
