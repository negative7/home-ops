---
- name: Bootstrap Debian
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_user: nasadmin
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Check host connectivity
      ansible.builtin.ping:

    # NetworkManager is the only network manager. VLAN20 (enp3s0) owns the main table and the
    # default route; VLAN1 (eno1) routes live in table 1, used only for traffic sourced from
    # 10.0.1.10, so replies leave the NIC they arrived on
    - name: network
      vars:
        legacy_nm_profiles:
          - "Wired connection 1"
          - "Wired connection 2"
          - "enp3s0"
          - "enp3s0.4"
      block:
        - name: network | Leave only loopback to ifupdown
          ansible.builtin.copy:
            dest: /etc/network/interfaces
            content: |
              # Managed by ansible; NICs are managed by NetworkManager
              source /etc/network/interfaces.d/*

              auto lo
              iface lo inet loopback
            owner: root
            group: root
            mode: "0644"

        - name: network | Stop NetworkManager creating "Wired connection" profiles
          ansible.builtin.copy:
            dest: /etc/NetworkManager/conf.d/no-auto-default.conf
            content: |
              [main]
              no-auto-default=*
            owner: root
            group: root
            mode: "0644"

        - name: network | VLAN20 profile (main table, default route)
          community.general.nmcli:
            type: ethernet
            conn_name: vlan20
            ifname: enp3s0
            method4: auto
            route_metric4: 100
            method6: disabled
            autoconnect: true
            state: present

        - name: network | VLAN1 profile (table 1, source-routed)
          community.general.nmcli:
            type: ethernet
            conn_name: vlan1
            ifname: eno1
            method4: auto
            never_default4: true
            route_metric4: 200
            routes4_extended:
              - ip: 0.0.0.0/0
                next_hop: 10.0.1.1
                table: 1
              - ip: 10.0.1.0/24
                table: 1
            routing_rules4:
              - priority 100 from 10.0.1.10 table 1
            method6: disabled
            autoconnect: true
            state: present

        - name: network | Find legacy profiles still present
          ansible.builtin.command: nmcli -g NAME connection show
          register: nm_profiles
          changed_when: false

        # Deleting the active profiles drops both links (and this SSH session), so a transient
        # unit does the delete and the reboot outside the session
        - name: network | Remove legacy profiles and reboot onto the new ones
          ansible.builtin.reboot:
            reboot_command: >-
              systemd-run --no-block --unit=lviv-network-cutover sh -c
              "nmcli connection delete {{ legacy_nm_profiles | select('in', nm_profiles.stdout_lines) | map('quote') | join(' ') }}; systemctl reboot"
            reboot_timeout: 600
          when: legacy_nm_profiles | select("in", nm_profiles.stdout_lines) | list | length > 0

    # Services listen on VLAN20 only; VLAN1 (eno1) carries SSH and Samba, enforced by its own nftables table
    - name: services
      vars:
        vlan20_ip: 10.2.0.10
        vlan1_interface: eno1
        nfs_exports:
          - path: /mnt/tank/data
            fsid: aa97f48c-9715-4e14-9a52-0517f1ed5438
            clients: 10.2.0.0/24
            options: rw,sync,no_subtree_check
          - path: /mnt/tank/data/immich
            fsid: 7c5941bd-898b-4626-9e5d-14202926a1a8
            clients: 10.2.0.0/24
            options: rw,sync,no_subtree_check
          - path: /mnt/tank/backups/plex
            fsid: 86a3b8c1-486d-4dba-9c87-a1c1496707ea
            clients: 10.2.0.0/24
            options: rw,sync,no_subtree_check
          - path: /mnt/tank/backups/adguard
            fsid: f11a6dff-f103-4386-8de0-2673ea390f12
            clients: 10.0.5.3
            options: rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000
        smb_shares:
          - {name: data, path: /mnt/tank/data}
          - {name: backups, path: /mnt/tank/backups}
      block:
        # Lets services bind 10.2.0.10 at boot before DHCP has assigned it
        - name: services | Allow binding addresses that are not up yet
          ansible.builtin.copy:
            dest: /etc/sysctl.d/60-nonlocal-bind.conf
            content: |
              net.ipv4.ip_nonlocal_bind = 1
            owner: root
            group: root
            mode: "0644"
          notify: Apply sysctl

        - name: services | Config directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - /etc/nfs.conf.d
            - /etc/nftables.d

        - name: services | Publish Docker ports on VLAN20 only
          ansible.builtin.copy:
            dest: /etc/docker/daemon.json
            content: "{{ {'ip': vlan20_ip} | to_nice_json }}\n"
            owner: root
            group: root
            mode: "0644"
          notify: Restart docker

        - name: services | NFS exports
          ansible.builtin.template:
            src: templates/exports.j2
            dest: /etc/exports.d/home-ops.exports
            owner: root
            group: root
            mode: "0644"
          notify: Reload NFS exports

        - name: services | NFSv4 only
          ansible.builtin.copy:
            dest: /etc/nfs.conf.d/home-ops.conf
            content: |
              [nfsd]
              vers3=n
            owner: root
            group: root
            mode: "0644"
          notify: Restart NFS server

        - name: services | Mask NFSv3 helpers
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            masked: true
            state: stopped
          loop:
            - rpcbind.socket
            - rpcbind.service
            - rpc-statd.service

        - name: services | Samba config
          ansible.builtin.template:
            src: templates/smb.conf.j2
            dest: /etc/samba/smb.conf
            owner: root
            group: root
            mode: "0644"
            validate: testparm -s %s
          notify: Restart Samba

        # upsmon on lviv talks to localhost; hass and nut_exporter use 10.2.0.10
        - name: services | NUT listens on loopback and VLAN20
          ansible.builtin.copy:
            dest: /etc/nut/upsd.conf
            content: |
              LISTEN 127.0.0.1 3493
              LISTEN {{ vlan20_ip }} 3493
            owner: root
            group: nut
            mode: "0640"
          notify: Restart NUT

        - name: services | VLAN1 firewall rules
          ansible.builtin.template:
            src: templates/vlan1-firewall.nft.j2
            dest: /etc/nftables.d/vlan1-firewall.nft
            owner: root
            group: root
            mode: "0644"
          notify: Restart VLAN1 firewall

        # Not nftables.service: its ExecStop flushes the whole ruleset, Docker's included
        - name: services | VLAN1 firewall unit
          ansible.builtin.copy:
            dest: /etc/systemd/system/vlan1-firewall.service
            content: |
              [Unit]
              Description=nftables input filter for the VLAN1 interface
              Wants=network-pre.target
              Before=network-pre.target

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/usr/sbin/nft -f /etc/nftables.d/vlan1-firewall.nft
              ExecStop=/usr/sbin/nft delete table inet vlan1_firewall

              [Install]
              WantedBy=multi-user.target
            owner: root
            group: root
            mode: "0644"
          notify: Restart VLAN1 firewall

        - name: services | Enable VLAN1 firewall
          ansible.builtin.systemd_service:
            name: vlan1-firewall.service
            enabled: true
            daemon_reload: true

    # Datasets are created by hand (moving data in needs a copy and a stop); this only enforces
    # their tuned properties. Byte-sized values are re-set every run, which is a no-op
    - name: zfs
      tags:
        - zfs
      vars:
        zfs_textfile_dir: /var/lib/node-exporter/textfile
        zfs_datasets:
          - name: tank
            properties: {dnodesize: auto}
          - name: tank/apps
            properties: {compression: zstd}
          # Cap so a runaway backup job can't fill the pool (includes the sanoid snapshots)
          - name: tank/apps/garage
            properties: {quota: 500G}
          - name: tank/apps/garage/meta
            properties: {recordsize: 16K}
          # Garage blocks are already zstd-compressed
          - name: tank/apps/garage/data
            properties: {recordsize: 1M, compression: lz4}
          # Zot registry cache (docker/lviv/05-zot): layers are already compressed; not snapshotted
          - name: tank/apps/zot
            properties: {quota: 200G, recordsize: 1M, compression: lz4}
          - name: tank/backups
            properties: {sync: standard, recordsize: 1M}
          - name: tank/data/immich
            properties: {recordsize: 1M}
          - name: tank/home
            properties: {compression: zstd}
          # Emergency headroom: zfs set refreservation=none tank/reserved
          - name: tank/reserved
            properties: {refreservation: 300G, mountpoint: none}
      block:
        - name: zfs | Dataset properties
          community.general.zfs:
            name: "{{ item.name }}"
            state: present
            extra_zfs_properties: "{{ item.properties }}"
          loop: "{{ zfs_datasets }}"
          loop_control:
            label: "{{ item.name }}"

        - name: zfs | Read autotrim
          ansible.builtin.command: zpool get -H -o value autotrim tank
          register: zpool_autotrim
          changed_when: false
          check_mode: false

        # HDD-only pool
        - name: zfs | Disable autotrim
          ansible.builtin.command: zpool set autotrim=off tank
          changed_when: true
          when: zpool_autotrim.stdout != "off"

        - name: zfs | Install sanoid
          ansible.builtin.apt:
            name: sanoid
            state: present
            update_cache: true
            cache_valid_time: 3600

        # The Debian package ships no /etc/sanoid
        - name: zfs | Sanoid config directory
          ansible.builtin.file:
            path: /etc/sanoid
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: zfs | Sanoid config
          ansible.builtin.template:
            src: templates/sanoid.conf.j2
            dest: /etc/sanoid/sanoid.conf
            owner: root
            group: root
            mode: "0644"

        - name: zfs | Enable sanoid timer
          ansible.builtin.systemd_service:
            name: sanoid.timer
            enabled: true
            state: started

        # node-exporter (docker/lviv/02-exporters) reads this through its /host/root bind mount
        - name: zfs | Textfile collector directory
          ansible.builtin.file:
            path: "{{ zfs_textfile_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: zfs | Metrics script
          ansible.builtin.template:
            src: templates/zfs-metrics.sh.j2
            dest: /usr/local/bin/zfs-metrics
            owner: root
            group: root
            mode: "0755"

        - name: zfs | Metrics units
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.name }}"
            content: "{{ item.content }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - name: zfs-metrics.service
              content: |
                [Unit]
                Description=Write ZFS pool and snapshot metrics for node-exporter

                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/zfs-metrics
            - name: zfs-metrics.timer
              content: |
                [Unit]
                Description=Write ZFS pool and snapshot metrics every 5 minutes

                [Timer]
                OnBootSec=1min
                OnUnitActiveSec=5min

                [Install]
                WantedBy=timers.target
          loop_control:
            label: "{{ item.name }}"

        - name: zfs | Enable metrics timer
          ansible.builtin.systemd_service:
            name: zfs-metrics.timer
            enabled: true
            state: started
            daemon_reload: true

    # Debian + Debian-Security origins only (the stock 50unattended-upgrades): Docker, zfs-dkms
    # (backports) and the other third-party repos stay manual. Reboots after kopiur's 03:00
    # full maintenance; NFS/Garage clients in the cluster just stall for the few minutes it takes
    - name: unattended-upgrades
      tags:
        - unattended-upgrades
      vars:
        auto_reboot_time: "05:00"
        textfile_dir: /var/lib/node-exporter/textfile
      block:
        - name: unattended-upgrades | Install
          ansible.builtin.apt:
            name: unattended-upgrades
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: unattended-upgrades | Enable periodic security upgrades
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/20auto-upgrades
            content: |
              APT::Periodic::Update-Package-Lists "1";
              APT::Periodic::Unattended-Upgrade "1";
            owner: root
            group: root
            mode: "0644"

        - name: unattended-upgrades | Enable timers
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - apt-daily.timer
            - apt-daily-upgrade.timer

        # NodeRebootRequired only fires if this didn't happen (see kube-prometheus-stack prometheusrules)
        - name: unattended-upgrades | Reboot automatically when required
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/52unattended-upgrades-reboot
            content: |
              Unattended-Upgrade::Automatic-Reboot "true";
              Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
              Unattended-Upgrade::Automatic-Reboot-Time "{{ auto_reboot_time }}";
            owner: root
            group: root
            mode: "0644"

        # node_reboot_required for node-exporter's textfile collector (dir is created by the zfs block)
        - name: unattended-upgrades | Reboot-required metric script
          ansible.builtin.copy:
            dest: /usr/local/bin/reboot-required-metric
            content: |
              #!/bin/sh
              # Managed by ansible. unattended-upgrades drops /run/reboot-required when an update needs a reboot
              set -eu
              out={{ textfile_dir }}/reboot.prom
              if [ -f /run/reboot-required ]; then v=1; else v=0; fi
              printf '# HELP node_reboot_required 1 if the host has pending updates that need a reboot.\n# TYPE node_reboot_required gauge\nnode_reboot_required %s\n' "$v" > "$out.tmp"
              mv "$out.tmp" "$out"
            owner: root
            group: root
            mode: "0755"

        - name: unattended-upgrades | Reboot-required metric units
          ansible.builtin.copy:
            dest: "/etc/systemd/system/{{ item.name }}"
            content: "{{ item.content }}"
            owner: root
            group: root
            mode: "0644"
          loop:
            - name: reboot-required-metric.service
              content: |
                [Unit]
                Description=Write the reboot-required metric for node-exporter

                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/reboot-required-metric
            - name: reboot-required-metric.timer
              content: |
                [Unit]
                Description=Write the reboot-required metric every 5 minutes

                [Timer]
                OnBootSec=1min
                OnUnitActiveSec=5min

                [Install]
                WantedBy=timers.target
          loop_control:
            label: "{{ item.name }}"

        - name: unattended-upgrades | Enable reboot-required metric timer
          ansible.builtin.systemd_service:
            name: reboot-required-metric.timer
            enabled: true
            state: started
            daemon_reload: true

    - name: Read secrets from 1Password
      ansible.builtin.shell: "op read 'op://{{ item.key }}' < /dev/null"
      delegate_to: localhost
      become: false
      loop:
        - key: home-cluster/doco-cd/1pw_sa_token
          var: doco_1pw_sa_token
        - key: home-cluster/doco-cd/api_secret
          var: doco_api_secret
        - key: home-cluster/doco-cd/webhook_secret
          var: doco_webhook_secret
      check_mode: false
      changed_when: false
      no_log: true
      register: secrets_raw

    - name: Set secret facts
      ansible.builtin.set_fact:
        doco_1pw_sa_token: "{{ secrets_raw.results[0].stdout }}"
        doco_api_secret: "{{ secrets_raw.results[1].stdout }}"
        doco_webhook_secret: "{{ secrets_raw.results[2].stdout }}"
      no_log: true

    - name: apps data
      vars:
        apps_data_dir: /mnt/tank/apps
      block:
        - name: apps data | Discover app directories referenced by compose files
          ansible.builtin.set_fact:
            apps_data_dirs: >-
              {{ lookup('ansible.builtin.pipe',
                "grep -rhoE '/mnt/tank/apps/[a-zA-Z0-9_-]+' " ~ playbook_dir ~ "/../../docker/lviv | sort -u | xargs -n1 basename"
              ).splitlines() }}
          delegate_to: localhost
          become: false
          run_once: true

        - name: apps data | Ensure directories exist with correct ownership
          ansible.builtin.file:
            path: "{{ apps_data_dir }}/{{ item }}"
            state: directory
            owner: apps
            group: apps
            mode: "0755"
          loop: "{{ apps_data_dirs }}"

        - name: apps data | Recursively fix ownership
          ansible.builtin.file:
            path: "{{ apps_data_dir }}/{{ item }}"
            state: directory
            owner: apps
            group: apps
            recurse: true
          loop: "{{ apps_data_dirs }}"

    - name: doco-cd
      vars:
        dococd_config_dir: /home/nasadmin/.config/doco-cd
      block:
        - name: doco-cd | Create directory
          ansible.builtin.file:
            path: "{{ dococd_config_dir }}"
            state: directory
            owner: nasadmin
            group: nasadmin
            mode: "0700"

        - name: doco-cd | Copy docker-compose app file
          ansible.builtin.copy:
            src: ../../docker/lviv/.doco-cd/docker-compose.app.yaml
            dest: "{{ dococd_config_dir }}/docker-compose.yaml"
            owner: nasadmin
            group: nasadmin
            mode: "0644"
          register: compose_file

        - name: doco-cd | Create secrets
          ansible.builtin.copy:
            dest: "{{ dococd_config_dir }}/{{ item.name }}"
            content: |
              {{ item.content }}
            owner: nasadmin
            group: nasadmin
            mode: "0600"
          no_log: true
          loop:
            - name: 1pw_token
              content: "{{ doco_1pw_sa_token }}"
            - name: api_secret
              content: "{{ doco_api_secret }}"
            - name: webhook_secret
              content: "{{ doco_webhook_secret }}"

        - name: doco-cd | Run docker-compose
          community.docker.docker_compose_v2:
            project_src: "{{ dococd_config_dir }}"
            files:
              - docker-compose.yaml
            pull: always
            state: present
          when: not ansible_check_mode

        - name: doco-cd | Wait for healthy
          community.docker.docker_container_info:
            name: doco-cd
          register: dococd_info
          until: dococd_info.container.State.Health.Status == "healthy"
          retries: 30
          delay: 10
          when: not ansible_check_mode

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/60-nonlocal-bind.conf
      changed_when: true

    - name: Restart docker
      ansible.builtin.systemd_service:
        name: docker.service
        state: restarted

    - name: Reload NFS exports
      ansible.builtin.command: exportfs -ra
      changed_when: true

    - name: Restart NFS server
      ansible.builtin.systemd_service:
        name: nfs-server.service
        state: restarted

    - name: Restart Samba
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop:
        - smbd.service
        - nmbd.service

    - name: Restart NUT
      ansible.builtin.systemd_service:
        name: nut-server.service
        state: restarted

    - name: Restart VLAN1 firewall
      ansible.builtin.systemd_service:
        name: vlan1-firewall.service
        state: restarted
        daemon_reload: true
